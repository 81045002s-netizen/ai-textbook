<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 教科書（教師版）</title><meta name="robots" content="noindex,nofollow">
<style>:root{
  --bg:#f7f6f2; --paper:#ffffff; --ink:#1f2328; --muted:#5d6470; --line:#dcd8cf;
  --accent:#1f5f8b; --accent-soft:#e6f0f7; --warn:#9a5b00; --warn-soft:#fff4e0;
  --ok:#1e7a46; --ok-soft:#e5f5ec; --bad:#b3261e; --bad-soft:#fdecea;
  --photo:#b3261e; --model:#1f5f8b; --sketch:#6b6b6b; --teacher:#6a3fa0; --teacher-soft:#f3edfa;
  --pending:#8a6d00; --pending-soft:#fffbe6;
  --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.08);
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --paper:#1f2227; --ink:#e7e9ec; --muted:#a3aab5; --line:#363b43;
    --accent:#7db8e0; --accent-soft:#1d2c38; --warn:#f0b35a; --warn-soft:#2e2414;
    --ok:#6fd19a; --ok-soft:#15291e; --bad:#f28b82; --bad-soft:#341a19;
    --photo:#f28b82; --model:#7db8e0; --sketch:#b0b0b0; --teacher:#c6a6f0; --teacher-soft:#261d33;
    --pending:#e8cf6a; --pending-soft:#2a2612;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --paper:#1f2227; --ink:#e7e9ec; --muted:#a3aab5; --line:#363b43;
  --accent:#7db8e0; --accent-soft:#1d2c38; --warn:#f0b35a; --warn-soft:#2e2414;
  --ok:#6fd19a; --ok-soft:#15291e; --bad:#f28b82; --bad-soft:#341a19;
  --photo:#f28b82; --model:#7db8e0; --sketch:#b0b0b0; --teacher:#c6a6f0; --teacher-soft:#261d33;
  --pending:#e8cf6a; --pending-soft:#2a2612;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:.35rem .8rem}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.link{border:none;background:none;color:var(--accent);padding:0;text-decoration:underline}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.4rem .55rem;width:100%}
textarea{resize:vertical}
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem;flex-wrap:wrap}
.topbar .brand{font-weight:700}
.topbar .mode{font-size:.8rem;padding:.1rem .5rem;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.topbar .mode.t{background:var(--teacher-soft);color:var(--teacher)}
.topbar .spacer{flex:1}
.topbar .sid{font-size:.9rem;color:var(--muted)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1240px;margin:0 auto}
.side{padding:1rem .75rem;border-right:1px solid var(--line);min-height:calc(100vh - 50px)}
.side a{display:block;padding:.3rem .6rem;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.95rem}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .sec{font-size:.75rem;color:var(--muted);margin:.8rem .6rem .2rem;letter-spacing:.05em}
.side a.t{color:var(--teacher)}
main{padding:1.25rem 1.5rem 4rem;min-width:0}
h1{font-size:1.6rem;margin:.2rem 0 1rem}
h2{font-size:1.25rem;margin:2rem 0 .75rem;padding-bottom:.3rem;border-bottom:2px solid var(--line)}
h3{font-size:1.05rem;margin:1.2rem 0 .5rem}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;margin:.8rem 0;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.pre{white-space:pre-line}
table{border-collapse:collapse;width:100%;background:var(--paper);font-size:.93rem}
th,td{border:1px solid var(--line);padding:.4rem .55rem;vertical-align:top;text-align:left;white-space:pre-line}
th{background:var(--accent-soft)}
.tablewrap{overflow-x:auto;margin:.5rem 0}
.kv th{width:9.5rem}
.badge{display:inline-block;font-size:.75rem;padding:.05rem .5rem;border-radius:99px;border:1px solid currentColor;margin-right:.3rem;white-space:nowrap}
.badge.k-實拍{color:var(--photo)} .badge.k-模型{color:var(--model)} .badge.k-示意{color:var(--sketch)} .badge.k-實拍＋模型{color:var(--photo)}
.badge.pending{color:var(--pending)} .badge.t{color:var(--teacher)}
.pending-box{border:1.5px dashed var(--pending);background:var(--pending-soft);color:var(--ink);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
.pending-box b{color:var(--pending)}
.teacher{border-left:4px solid var(--teacher);background:var(--teacher-soft);border-radius:6px;padding:.6rem .85rem;margin:.6rem 0}
.teacher > .tl{font-size:.78rem;font-weight:700;color:var(--teacher);letter-spacing:.05em}
.step{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin:1.2rem 0;box-shadow:var(--shadow)}
.step > header{display:flex;gap:.6rem;align-items:baseline;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--accent-soft);border-radius:var(--radius) var(--radius) 0 0}
.step > header .n{font-weight:700;color:var(--accent);font-size:1.1rem}
.step > header .tm{color:var(--muted);font-size:.85rem}
.step > .body{padding:.6rem 1rem 1rem}
.text-block p{margin:.5rem 0}
.text-block .src{font-size:.8rem;color:var(--muted)}
details.cond{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:.4rem .8rem;margin:.6rem 0}
details.cond summary{cursor:pointer;color:var(--warn);font-weight:600}
.understand{border-left:4px solid var(--accent);padding:.2rem .8rem;margin:.6rem 0;background:var(--accent-soft);border-radius:4px}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem;margin:.6rem 0}
.asset{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.asset .ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:.6rem;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 10px,var(--paper) 10px,var(--paper) 20px);color:var(--muted);font-size:.85rem}
.asset img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;background:#000}
.asset .meta{padding:.45rem .6rem;font-size:.82rem}
.asset .meta .fn{word-break:break-all}
.asset .lic{color:var(--muted)}
.asset.wide{grid-column:1/-1}
.q{border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;margin:.8rem 0;background:var(--paper)}
.q .qh{font-weight:700;color:var(--accent)}
.q .prompt{margin:.2rem 0 .5rem}
.q .part{margin:.45rem 0}
.q .part > label.pl{display:block;font-size:.92rem;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:.3rem 1rem}
.opts label{display:inline-flex;align-items:center;gap:.3rem}
.choice-grid{display:grid;grid-template-columns:auto auto 1fr;gap:.2rem .8rem;align-items:center}
.q .actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}
.q .state{font-size:.82rem;color:var(--muted)}
.q.locked{border-color:var(--ok)}
.q .draft{background:var(--bg);border-radius:6px;padding:.4rem .6rem;font-size:.9rem;margin:.4rem 0}
.lock-notice{border:2px dashed var(--accent);border-radius:var(--radius);padding:1.2rem;text-align:center;color:var(--accent);background:var(--accent-soft);margin:1rem 0}
.pad{border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none;width:100%;max-width:640px;display:block}
.padbar{display:flex;gap:.4rem;margin:.3rem 0}
.hint{border:1px solid var(--ok);background:var(--ok-soft);border-radius:8px;padding:.6rem .85rem;margin:.6rem 0}
.hint .lv{font-weight:700;color:var(--ok);white-space:pre-line;min-width:4.5rem;display:inline-block}
.hint .row{display:flex;gap:.6rem;margin:.35rem 0}
.ai{border:1px dashed var(--muted);border-radius:8px;padding:.6rem .85rem;margin:.6rem 0;color:var(--muted)}
.core{border:1px solid var(--accent);border-radius:8px;padding:.7rem .9rem;margin:.8rem 0}
.core .ct{font-size:.8rem;font-weight:700;color:var(--accent)}
.rub{display:grid;grid-template-columns:5rem 1fr;gap:.2rem .6rem}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:.5rem;color:#fff;padding:1rem}
.lightbox img{max-width:95vw;max-height:80vh}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--paper);border-radius:12px;padding:1.4rem;max-width:420px;width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sim{border:1px solid var(--line);border-radius:8px;padding:.6rem;background:var(--paper)}
.sim canvas{width:100%;display:block;background:#fff;border-radius:6px}
.sim .ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.4rem .8rem;margin:.5rem 0;font-size:.9rem}
.sim .readout{font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:1.5rem;text-align:center;color:var(--muted)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.thumb{max-width:220px;border:1px solid var(--line);background:#fff}
/* projection */
.proj{position:fixed;inset:0;background:var(--paper);z-index:40;overflow:auto;padding:2rem 3rem;font-size:1.45rem}
.proj .projbar{position:fixed;right:1rem;bottom:1rem;display:flex;gap:.5rem;font-size:1rem}
.proj .hidden-block{display:none}
.proj h1{font-size:2.2rem}
.proj .assets{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{min-height:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.2rem;padding:.5rem 16px}
  .side .sec{width:100%;margin:.3rem 0 0}
  main{padding:1rem 16px 3rem}
  .proj{padding:1rem 16px;font-size:1.15rem}
}
/* print */
.print-page{background:#fff;color:#000;max-width:800px;margin:0 auto;padding:1rem}
.print-page .pq{break-inside:avoid;border-bottom:1px solid #ccc;padding:.6rem 0}
.print-page .lines div{border-bottom:1px solid #999;height:1.9rem}
.print-page .drawbox{border:1px solid #000;height:150px;margin:.3rem 0}
.print-page .ans{border:1px solid #6a3fa0;padding:.4rem .6rem;margin:.4rem 0;font-size:.9rem}
@media print{
  .topbar,.side,.noprint,.toolbar{display:none !important}
  .layout{display:block}
  main{padding:0}
  body{background:#fff;color:#000}
  .print-page{padding:0}
}
</style></head>

<script>window.TB={"mode": "teacher", "built_at": "2026-11-27 07:18", "units": [{"meta": {"id": "interference-diffraction", "title": "干涉與繞射", "field": "自然科學／物理", "grade": "高一", "material_version": "範例v1.0／115.09.04", "lessons": [{"n": 1, "title": "第1節　波的疊加與水波干涉", "nodes": ["01"]}, {"n": 2, "title": "第2節　光的雙狹縫干涉", "nodes": ["02"]}, {"n": 3, "title": "第3節　光的繞射與生活應用", "nodes": ["03", "04"]}]}, "text": {"source": "本專案《01_核心教材文本開發表_干涉與繞射示範版.docx》，原文照錄，未修改。", "formal_note": "本節以原始檔案（01 示範版）原文為正式版本；日後如提供出版社課本，改以課本原文替換。", "overview": [{"label": "單元名稱", "value": "干涉與繞射"}, {"label": "適用對象", "value": "高中一年級必修物理；已學過波的波長、頻率、週期與振幅等物理概念，採定性理解。"}, {"label": "核心結論", "value": "光的干涉與繞射形成有規律的明暗分布，可用波的疊加與惠更斯原理解釋，因此支持光具有波動性。"}, {"label": "先備知識", "value": "知道波會傳播；能區分位移與振幅，理解波長、頻率及週期的意義。"}, {"label": "內容範圍", "value": "處理波的疊加、水波干涉、雙狹縫、單狹縫與薄膜干涉；以定性解釋為主，暫不推導條紋位置及膜厚公式。"}], "node_order": [{"no": "01", "name": "波的疊加與水波干涉", "core": "波的疊加可造成振幅增強或減弱；位移為零不等於振幅為零。", "link": "先備：位移、振幅、週期。"}, {"no": "02", "name": "雙狹縫干涉", "core": "兩列相干光波疊加，在屏幕形成穩定的明暗分布。", "link": "承接01：將振幅增減連到光的明暗。"}, {"no": "03", "name": "單狹縫繞射", "core": "狹縫內不同位置的次波疊加，形成中央寬亮紋與旁側弱亮紋。", "link": "承接02：由兩個次波源推進到縫內許多次波源。"}, {"no": "04", "name": "薄膜干涉與單元統整", "core": "薄膜反射光的干涉可形成色彩；干涉與繞射共同支持光的波動性。", "link": "承接02、03：應用疊加概念並收束全章。"}], "nodes": {"01": {"title": "01　波的疊加與水波干涉", "understanding": "在理想線性介質中，合位移等於各波位移之和；固定位置的振幅取決於兩列波的振動關係。", "body": ["兩列繩波脈衝相遇時，會暫時在同一段繩上重疊。在理想線性介質中，該處的合位移等於兩列波各自造成的位移相加。相遇結束後，兩列脈衝仍各自沿原方向傳播。", "對同一位置的兩列同頻率週期波而言，若振動步調相同，合振幅最大，稱為完全建設性干涉；若振幅相等且振動步調恰好相反，合振幅為零，稱為完全破壞性干涉。", "位移是某一時刻偏離平衡位置的程度；振幅則是週期振動中偏離平衡位置的最大程度。某一刻位移為零，不能據此認定振幅為零。", "兩個位置固定、振動關係固定的水波源，可形成位置穩定的干涉分布。完全相消還要求兩列波到達該處時振幅相等。局部振幅為零，不代表兩列波永久消失。"], "conditions": "疊加採理想線性近似。穩定干涉須有固定的波源相位關係；完全相消須在觀察處等振幅、反相。應寫「位移相消」，避免把它說成總能量消失。", "teacher": {"curriculum_note": "（可扣課綱代碼）", "check_label": "參考書目", "check": ["查核重點：線性疊加、波通過彼此、完全相消的條件。", "OpenStax University Physics Vol. 1 §16.5（2026-09-04查核）"], "self_check_label": "自我檢核", "self_check": ["■ 名詞與定義一致　■ 因果或關係正確", "■ 適用條件完整　　■ 前後概念連貫", "■ 關鍵說法有依據"]}}, "02": {"title": "02　雙狹縫干涉", "understanding": "兩列相干光波到達屏幕各處時的相位差不同，形成穩定的明暗條紋。", "body": ["單色光照射兩條相近的窄縫後，屏幕可出現交替排列的明暗條紋。這些條紋是光在不同位置的強度分布，不能當成兩條狹縫的放大影像。", "依惠更斯原理，波面上各點可視為發出次波的波源；在窄縫近似下，兩條狹縫可視為兩個次波源。同一穩定單色光適當照明兩縫時，兩者頻率相同，並保持固定的相位關係，稱為相干波源。相位描述週期振動進行到哪個階段。", "兩列光波到達某處時，若相位相同便互相增強；若相位相反便互相減弱。兩列光波在該處振幅相等且反相時，可完全相消。眼睛無法追蹤光的快速振動，看到的是時間平均的光強度，因此形成亮紋與暗紋。", "暗紋不表示兩列光波都未到達。光波疊加可以解釋這種規律分布，提供光具有波動性的證據。"], "conditions": "此處採同偏振方向、相干單色光的理想模型。完全暗紋還需等振幅；實驗暗紋可能仍有背景光。兩縫都會產生繞射，不能說雙狹縫只有干涉。", "teacher": {"check_label": "查核依據", "check": ["查核重點：相干條件、次波源近似與明暗紋的形成。", "OpenStax University Physics Vol. 3 §3.1（2026-09-04查核）"], "self_check_label": "精確性檢核", "self_check": ["■ 名詞與定義一致　■ 因果或關係正確", "■ 適用條件完整　　■ 前後概念連貫", "■ 關鍵說法有依據"]}}, "03": {"title": "03　單狹縫繞射", "understanding": "光通過窄縫後，縫內不同位置的次波在各方向增強或減弱，形成繞射的明暗分布。", "body": ["單色光通過窄單狹縫後，會向側方展開。在遠場條件下，屏幕中央出現較寬、較亮的中央亮紋，兩側則有較窄、逐漸變弱的旁側亮紋，亮紋之間由暗紋隔開。此處的遠場指屏幕足夠遠，使縫內各處到同一觀察點的傳播方向可近似平行。", "以均勻、同相照明的狹縫為例，縫內不同位置可視為許多次波源。正前方的次波大致同相到達，彼此增強；偏離正前方後，各次波的路徑長度不同，某些方向完全相消，另一些方向仍有部分增強。", "在相同波長與遠場觀察條件下，於本教材的狹縫尺度內縮小縫寬，會使繞射展開角度增加，中央亮紋變寬。這不是狹縫影像的單純放大。", "雙狹縫以兩縫之間的光波疊加說明條紋；單狹縫則考慮同一縫內不同位置的次波疊加。兩者都運用波的疊加概念。"], "conditions": "中央寬亮紋與旁側亮紋的敘述採遠場、均勻單色照明條件。「縫越窄，展開越明顯」須固定波長並限於本教材尺度，不能外推到所有縫寬與近場情況。", "teacher": {"check_label": "查核依據", "check": ["查核重點：遠場假設、次波疊加、中央亮紋與縫寬關係。", "OpenStax University Physics Vol. 3 §4.1（2026-09-04查核）"], "self_check_label": "精確性檢核", "self_check": ["■ 名詞與定義一致　■ 因果或關係正確", "■ 適用條件完整　　■ 前後概念連貫", "■ 關鍵說法有依據"]}}, "04": {"title": "04　薄膜干涉與單元統整", "understanding": "透明薄膜兩表面的反射光可發生干涉；薄膜色彩與狹縫明暗分布均可用光的波動模型解釋。", "body": ["白光照到肥皂膜或水面油膜時，部分光在上表面反射，另一部分進入薄膜，在下表面反射後再離開。兩部分光朝同一觀察方向傳播時，可以互相干涉。", "干涉結果與膜厚、折射率、觀察角度及光的波長有關，也受到反射時振動相位改變的影響。相位描述振動進行到哪個階段；折射率則反映光在介質中的傳播速度。膜厚隨位置變化時，白光中的不同波長可能在不同位置增強或減弱，因而呈現彩色分布。", "牛頓環與薄空氣膜的干涉有關；抗反射鍍膜利用干涉，在設計的波長與角度範圍內降低反射。這些例子都能連回光波疊加的概念。", "回顧雙狹縫與單狹縫，雖然參與疊加的次波源分布不同，兩者都形成有規律的明暗分布。這些現象可由波動模型解釋，因此支持光具有波動性。"], "conditions": "以透明薄膜的反射光作定性說明；不能只比較幾何路徑而忽略反射相位。「抗反射」有波長與角度範圍，不表示所有光都不反射。波動性證據也不等於否定光的粒子性。", "teacher": {"check_label": 狹縫干涉與單狹縫繞射的共同原理。"}}, {"id": "ANIM-07B", "group": "s07b", "type": "動畫", "kind": "模型", "lessons": [1], "file": "波的疊加動畫影片", "status": "missing", "license": "本教材自製", "teacher": {"use": "知識節點：疊加與通過後狀態。配合第1節學習單Q1–Q3，讓學生說明脈衝相遇前後的變化。", "needs": "輸出需求：MP4／1920×1080／16∶9／36秒，另附字幕文字檔；依據第1節學習單Q1–Q3，時長為示範設定。"}}, {"id": "SIM-superpose-07B", "group": "s07b", "type": "模擬", "kind": "模型", "lessons": [1], "file": "可調脈衝高度的疊加模擬", "status": "built", "license": "本教材自製", "caption": "理想線性介質中的模型示意", "teacher": {"use": "配合第1節學習單Q1–Q3，先預測，再調整脈衝高度比較結果。", "needs": "交付離線HTML，支援電腦與平板；附操作文字及相遇前、重疊、通過後三張靜態圖。"}}]}, "misconceptions": {"note": "填寫示例；選列5項困難，學生語句為情境示範，非實測紀錄。", "teacher": {"basic": [{"label": "單元名稱", "value": "干涉與繞射"}, {"label": "設計者／日期", "value": "江長屹／115.09.04"}, {"label": "領域／年段", "value": "高中物理／高一"}, {"label": "節次／活動", "value": "共3節／含課後修訂"}, {"label": "學習重點", "value": "辨識波的疊加，區分實拍與模型，並用證據說明光的干涉與繞射。"}], "guide_note": "每項困難可複製本頁；一次給一層提示，依學生回應調整。", "refs": [{"text": "教育部診斷教學案例（2020）", "url": "https://www.moe.gov.tw/News_Content.aspx?n=9E7AC85F1954DDA8&s=2D60AD02820F68AD"}, {"text": "國教院自然科補充教材示例（2013）", "url": "https://epaper.naer.edu.tw/edm?content_no=1697&edm_no=63"}], "footer": "本表依教材需求自編，非教育部制式表單。"}, "levels": {"L1": "L1\n釐清想法", "L2": "L2\n回看證據", "L3": "L3\n連結說明"}, "items": [{"id": "m-bounce", "lesson": 1, "quick_name": "波像物體碰撞", "name": "波相遇會反彈", "questions": "第1節／學習單Q1、Q2", "hints": {"L1": "你預測脈衝會反彈，\n是根據什麼想法？", "L2": "追蹤同一脈衝的相遇前、重疊與通過後；\n它的傳播方向有改變嗎？", "L3": "依Q2的圖，\n你會如何修訂「相遇後會反彈」？"}, "teacher": {"quick": {"performance": "「兩個波撞到後，\n會一起彈回去。」", "guidance": "追蹤同一脈衝，\n比較相遇、重疊及通過後。", "criterion": "能指出通過後仍沿\n原方向傳播。"}, "performance": "學生在Q1選「反彈」，認為兩個脈衝相遇後會倒退。", "focus": "在理想線性介質中，區分重疊時的合成波形與通過後的傳播方向。", "materials": {"L1": "Q1預測與理由", "L2": "繩波模擬\nQ2三階段作圖", "L3": "Q1初稿\nQ2觀察紀錄"}}}, {"id": "m-amplitude", "lesson": 1, "quick_name": "位移等於振幅", "name": "位移等於振幅", "hints_pending": true, "teacher": {"quick": {"performance": "「這一刻是零，\n所以振幅是零。」", "guidance": "固定同一位置，觀察完整週期；\n比較瞬時位移與最大位移。", "criterion": "能以完整週期的\n最大位移判斷振幅。"}}}, {"id": "m-dark", "lesson": 2, "quick_name": "暗紋等於無光", "name": "暗紋等於沒有光到達", "questions": "第2節／學習單Q4", "hints": {"L1": "你說「沒有光到達D」，\n是根據哪項觀察？", "L2": "在模型連出兩狹縫到D的路徑；\n兩路是否都能到達？", "L3": "D點兩路光到達時的振動關係，\n如何影響合成振幅與亮度？"}, "teacher": {"quick": {"performance": "「D點是暗的，\n所以沒有光到達。」", "guidance": "先看兩狹縫到D的路徑，\n再比較到達時的振動關係。", "criterion": "能連結兩路到達、\n反相疊加與暗紋。"}, "performance": "學生在Q4寫：「D點沒有光到達，所以是暗的。」", "focus": "區分兩路光各自到達，與疊加後的合成振幅及亮度。", "materials": {"L1": "Q4初稿\n雙狹縫紅光實拍", "L2": "第2節次波模型\nB與D的位置", "L3": "B／D比較圖\n學生修訂稿"}}}, {"id": "m-model-photo", "lesson": 2, "quick_name": "模型當成實拍", "name": "模型當成實拍", "hints_pending": true, "teacher": {"quick": {"performance": "「照片裡的光\n沿圓弧前進。」", "guidance": "並列實拍與波前圖，請學生\n標示來源及各圖能說明的事。", "criterion": "能區分亮度證據\n與模型線條。"}}}, {"id": "m-unrelated", "lesson": 3, "quick_name": "干涉繞射無關", "name": "干涉與繞射原理無關", "questions": "第3節／活動一比較表", "hints": {"L1": "你認為原理不同，\n是根據兩張圖的哪個差異？", "L2": "在兩個模型標出次波源；\n它們各自如何分布？", "L3": "根據次波源與明暗紋，\n你會如何修訂「兩者原理無關」？"}, "teacher": {"quick": {"performance": "「這兩個現象的\n原理完全不同。」", "guidance": "比較雙狹縫與單狹縫模型，\n找出次波源分布與疊加關係。", "criterion": "能指出共同疊加原理\n及次波源分布的差異。"}, "performance": "學生說：「干涉和繞射的圖樣不同，所以原理完全不同。」", "focus": "用次波疊加連結兩種現象，區分兩狹縫與單狹縫的次波源分布。", "materials": {"L1": "雙狹縫與單狹縫實拍\n學生原說法", "L2": "活動一比較表\n雙狹縫與單狹縫模型", "L3": "活動一比較表\n學生修訂稿"}}}]}, "core": {"source": "題目來源：同資料夾「干涉與繞射 核心教學題目 原始完整版備份」。七題沿用原識別碼。", "unit_info": [{"label": "領域與科目", "value": "自然科學領域／高中物理；單元：干涉與繞射。"}, {"label": "年級與節數", "value": "高中學習階段；共3節課。"}, {"label": "主要學習目標", "value": "能以波的疊加解釋光的雙狹縫干涉與單狹縫繞射，並定性說明光支持波動性；能區分真實證據與模型，說明波動描述的適用範圍。"}, {"label": "內容範圍與邊界", "value": "處理七個可評量知識節點，以觀察、比較與定性解釋為主；不要求條紋間距、膜厚公式推導、參數掃描或光的全部性質。"}, {"label": "預計題數", "value": "共7題：第1節2題、第2節2題、第3節3題。"}], "items": [{"no": 1, "lesson": 1, "stage": "第1節\n預測與解釋", "goal": "能以同一位置、同一時刻的位移代數和判斷合成結果，並說明兩波通過後的狀態。", "question": "兩列波在同一位置相遇時，合成位移如何決定？兩列波通過彼此後又會發生什麼？", "teacher": {"function": "概念建構與迷思診斷", "concepts": "波的疊加原理、質點位移、合成波、建設性／破壞性疊加", "evidence": ["相遇前、完全重疊、通過後三個代表時刻；同向與等大反向兩組繩波畫面；學生的合成波預測圖與修訂圖。", "保存：學習單的預測、修訂與文字解釋；標明觀察或模型來源。"], "answer": ["須以同一位置、同一時刻的分波位移作代數相加；同向位移使合成位移增大，反向位移使合成位移減小，等大反向時瞬時合成位移可為零。重疊只發生於相遇期間，在理想線性介質中，兩列波通過後仍各自依原方向傳播。"], "misconceptions": "把波相遇視為物體碰撞而反彈、黏住或消失；把瞬時合成位移為零說成兩列波或總能量永久消失；只寫「相加」卻未指明同一位置與同一時刻。", "rubric": {"達成": "能畫出或敘述兩組代表案例的合成結果，明確使用位移代數和，並說明通過後各自傳播。", "發展中": "能判斷增強或減弱，但缺少位置、時刻條件，或未交代通過後狀態。", "待支持": "將兩波說成互撞反彈、永久合併或消失，或把相消解釋為能量不存在。"}}}, {"no": 2, "lesson": 1, "stage": "第1節\n觀察與解釋", "goal": "能依一段時間的起伏紀錄辨認腹線與節線，並解釋其位置穩定的原因。", "question": "兩個同相點波源為什麼會形成位置穩定的腹線與節線，而不是隨機斑塊或另一組向外傳播的波？", "teacher": {"function": "現象解釋與證據判讀", "concepts": "同調波源、雙點波源干涉、腹線、節線、振幅與瞬時位移", "evidence": ["同一位置在一個週期內的起伏紀錄、3D水面與俯視圖的對照、振幅最大與接近不動位置的選點紀錄。不得只用單一時刻的顏色或光影判斷。", "保存：選點、起伏紀錄及文字解釋，並註明實驗或模型。"], "answer": ["兩波源同頻率且相位關係固定，使固定位置的到達相位差保持穩定。同相到達時振幅增大；反相到達時振幅減小，觀察處等振幅時才完全相消。", "振幅極大或極小的位置連成腹線、節線；這些線不是向外移動的波前。判讀須看一段時間的起伏。"], "misconceptions": "只把波峰交點當成建設性干涉；以亮色等同腹線、暗色等同節線；認為節線必定在真實水槽中完全靜止；把腹線或節線畫成向外傳播的圓形波。", "rubric": {"達成": "能從一段時間的振幅紀錄指出腹線與節線，並用固定到達關係、位移疊加與線狀分布完成因果鏈。", "發展中": "能辨認腹線、節線或建設性、破壞性干涉，但未說明為何位置穩定或未區分振幅與瞬時位移。", "待支持": "只依顏色、單張截圖或波峰交點判斷，或把干涉線當成波前。"}}}, {"no": 3, "lesson": 2, "stage": "第2節\n預測與觀察", "goal": "能比較直進模型的預測與真實屏幕特徵，提出修正模型的理由。", "question": "如果光只沿直線前進，雙狹縫後的屏幕應出現什麼？實際觀察到的多條規律亮暗紋，如何迫使我們修正原來的模型？", "teacher": {"function": "認知衝突與模型診斷", "concepts": "雙狹縫屏幕圖樣、證據來源、模型比較、光的波動性", "evidence": ["教師現場雷射示範、可信實拍或影片中的完整屏幕亮度分布；至少指出中央、左右排列或明暗交替等可回查特徵。波前弧線與理想亮度圖只能作模型，不作主要實驗證據。", "保存：第2節學習單Q1–Q3，保留資料來源、原預測與比較理由。"], "answer": ["在本活動的近似平行入射及單純幾何直進模型下，預期為兩條狹縫的投影；它無法說明實際屏幕多條明暗交替的分布。", "指出可回查的觀察與預測之差異，再引入能描述光波展開、重疊、增強與減弱的模型。"], "misconceptions": "把兩條狹縫本身畫成屏幕圖樣；以理想模擬取代真實觀察；只寫「因為光是波」而未指出直進模型失效的具體證據。", "rubric": {"達成": "能分別表達原模型的預測與實際屏幕特徵，指出兩者矛盾，並說明為何需引入波動模型。", "發展中": "知道屏幕有多條亮暗紋，但沒有清楚比較原預測，或未標示證據來源。", "待支持": "仍以兩條狹縫影像解釋整個圖樣，或把模擬波前當成肉眼直接看到的證據。"}}}, {"no": 4, "lesson": 2, "stage": "第2節\n解釋", "goal": "能連結相干次波源、相位關係與光波疊加，說明亮紋及暗紋。", "question": "兩道狹縫為什麼可以視為兩個相干次波源？兩列光波如何在屏幕上形成亮紋與暗紋？", "teacher": {"function": "機制解釋與證據論證", "concepts": "惠更斯原理、相干次波源、建設性／破壞性干涉、時間平均光強度", "evidence": ["真實屏幕中的亮暗分布作為現象證據；惠更斯波前、兩狹縫次波源與B亮／D暗位置模型作為機制說明。", "保存：第2節學習單Q4、Q6；分別標示現象證據與解釋模型。"], "answer": ["在惠更斯觀點下，窄縫可近似為次波源；同一束相干單色光照明，使兩狹縫的出射波同頻率且相位差固定。", "在同偏振的討論下，同相到達使時間平均光強較大；反相到達使光強減小，觀察處等振幅時理想光強為零。暗紋不是沒有光波到達。"], "misconceptions": "把暗紋說成沒有光到達；把水波模擬當成光的實驗證據；把波前圓弧當作可見光路；混淆瞬時振動與屏幕時間平均光強度。", "rubric": {"達成": "能完整連結惠更斯原理、兩個相干次波源、相位關係、干涉結果與屏幕亮度，並區分真實證據與模型。", "發展中": "能寫出同相亮、反相暗，但未說明次波源由來、光強度或證據地位。", "待支持": "把亮暗解釋成狹縫影像、遮擋或有無光到達，或把模型圖當作實拍。"}, "check": "條件核對：OpenStax University Physics 3 §3.1"}}, {"no": 5, "lesson": 3, "stage": "第3節\n觀察與解釋", "goal": "能比較兩種代表性圖樣與次波源分布，並指出共同的疊加原理。", "question": "雙狹縫干涉與單狹縫繞射的屏幕圖樣不同，為什麼仍可以用同一個次波疊加原理解釋？", "teacher": {"function": "跨現象比較與概念遷移", "concepts": "單狹縫繞射、雙狹縫干涉、離散／連續次波源分布、圖樣比較", "evidence": ["比較教材的遠場代表性實拍：描述單狹縫中央亮紋相對其旁側亮紋的寬度與強弱，以及雙狹縫中央附近的明暗排列；次波源示意用於機制解釋。", "保存：兩種真實圖樣的文字比較及次波源解釋，註明素材來源。"], "answer": ["兩者皆可由次波疊加說明。窄雙縫近似為兩個分立次波源；單縫內有連續分布的次波源，因此可形成不同的明暗分布。", "均勻照明的單縫遠場圖樣中，中央亮紋比自身旁側亮紋寬且亮，旁側峰值向外減弱；雙縫中央附近明暗交替。不直接斷言不同裝置的中央寬度大小。"], "misconceptions": "把單狹縫圖樣當成狹縫的放大影像；認為繞射與干涉是兩套毫無關聯的原理；只說光彎曲而未交代次波源分布與疊加。", "rubric": {"達成": "能同時描述主要圖樣差異、次波源分布差異與共同的疊加機制。", "發展中": "能描述圖樣或次波源其中一項，但未建立兩者的因果連結。", "待支持": "仍使用幾何投影解釋，或把干涉與繞射視為完全不同機制。"}, "check": "條件核對：OpenStax University Physics 3 §4.1"}}, {"no": 6, "lesson": 3, "stage": "第3節\n生活應用", "goal": "能指出薄膜上、下界面的兩路反射光，以干涉定性解釋色彩。", "question": "透明薄膜沒有彩色顏料，為什麼仍會出現彩色區帶？到達眼睛的是哪兩路光？", "teacher": {"function": "生活情境遷移", "concepts": "薄膜干涉、上／下界面反射光、反射光疊加、生活遷移", "evidence": ["肥皂膜、肥皂泡或油膜的真實彩色現象；薄膜剖面中上表面直接反射光，以及進入薄膜後由下表面反射返回的光。", "保存：薄膜觀察來源與兩路反射光的文字說明。"], "answer": ["白光照膜後，一路由上表面直接反射；另一路進入薄膜，由下表面反射後穿出上表面。兩路光在觀察方向重疊干涉，使不同波長受到不同程度的增強或減弱。", "教師掌握：相位差涉及光程及反射相位變化。本題只評量兩路反射光與定性干涉，不要求膜厚或顏色計算。"], "misconceptions": "把顏色歸因於顏料或只歸因於折射；只記得『薄膜干涉』名詞，卻無法指出兩路反射光；要求超出本單元範圍的膜厚公式或特定顏色計算。", "rubric": {"達成": "能指出兩路反射光，說明它們重疊干涉並造成不同波長增強或減弱；不把顏色歸因於色素。", "發展中": "能判斷為干涉，但未完整指出兩路反射光或只寫名詞。", "待支持": "只以顏料或折射解釋，或無法辨認上、下界面的反射路徑。"}, "check": "條件核對：OpenStax University Physics 3 §3.4"}}, {"no": 7, "lesson": 3, "stage": "第3節\n統整評量", "goal": "能引用兩項真實光學觀察支持波動描述，並說明此結論的界限。", "question": "雙狹縫干涉與單狹縫繞射如何共同支持光具有波動行為？這項結論的適用範圍是什麼？", "teacher": {"function": "跨現象統整與科學論證", "concepts": "模型判別、證據地位、光的波動性、模型適用範圍", "evidence": ["雙狹縫後多條明暗交替的實拍；單狹縫遠場中央亮紋較自身旁側亮紋寬、旁側較弱的實拍。兩項均須有可回查來源。", "保存：統整短文，列出兩項觀察來源、推論與適用範圍。"], "answer": ["兩項觀察都需要能展開、疊加並在不同位置增強或減弱的波動描述。單純直進模型既未預測完整圖樣，也無法同時解釋亮暗交替與幾何陰影區中的展開。兩項證據共同支持光在這些情境中具有波動行為；這不等於單靠本單元已完整說明光的全部性質。"], "misconceptions": "只寫『因為光是波』而沒有證據與比較；把水波或模擬當成支持光的主要實證；過度宣稱波動模型已解釋光的一切，或提前延伸到本單元未處理的內容。", "rubric": {"達成": "能列出兩項真實光學證據、比較直進與波動模型的解釋力，並清楚寫出論證界限。", "發展中": "能指出干涉或繞射其中一項支持波動性，但證據不完整、缺少模型比較或界限。", "待支持": "只重述結論、使用模擬作主要證據，或作出超出本單元證據範圍的宣稱。"}}}]}, "blueprint_notes": {"levels": ["記憶", "了解", "應用", "分析", "評鑑", "創造"], "intro": "依自然科學領域課綱「科學認知」六層次設欄；未涵蓋的交叉格填「—」，不必每層均有題。", "notes": ["層次提示：記憶＝回想事實；了解＝解釋概念；應用＝運用原理；分析＝拆解關係；評鑑＝依標準判斷；創造＝提出新方案。依主要作答歷程分類，不以題型或難度判定。", "填寫提醒：占分比＝該列配分÷該份評量總分×100%；可增刪內容列。", "層次依據：教育部《十二年國民基本教育課程綱要－自然科學領域》，表二（第9頁）。"], "signature": "命題教師：＿＿＿＿＿＿　審題教師：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日"}, "scripts": {"teacher": {"scripts": [{"title": "同向與反向脈衝完全重疊比較圖", "intro": "每張圖片填一份；可用文字、手繪或貼圖表達；大型草圖填於下一頁。本例為製作需求，尺寸與數值為示範設定。", "fields": [{"label": "基本資料", "lines": ["同向與反向脈衝完全重疊比較圖。", "適用：高中一年級必修物理；編寫者：＿＿＿＿。"]}, {"label": "知識節點與使用目的", "lines": ["節點：同一位置位移的代數和。第1節學習單Q2–Q3，觀察後比較完全重疊的兩種結果。"]}, {"label": "畫面構圖與必要元素", "lines": ["左右並列「同向位移」與「反向位移」，均呈現等大、同形脈衝完全重疊的瞬間；反向案例上下對稱。", "每欄上圖為分波A、B，下圖為當下合成繩形；共用相同座標尺度與P點位置。", "同向案例中央為＋1＋1＝＋2；反向為＋1－1＝0。數值採相對單位。"]}, {"label": "文字與符號標示", "lines": ["標題：「兩種完全重疊的比較」。橫軸為位置，縱軸為位移，均標平衡位置。", "A用細實線、B用虛線，合成繩形用粗實線；加文字標籤區別。", "下圖標「完全重疊當下」，圖下注「理想線性介質中的模型示意」。"]}, {"label": "多模態呈現容易誤解處", "lines": ["三條曲線可能被當成三條繩子：將分波輔助線與合成繩形分區，註明分波是模型表示。", "零位移可能被當成波消失：補註「只在完全重疊當下相消，之後兩脈衝仍各自傳播」。", "兩欄使用相同尺度，避免把繪圖大小當成不同物理條件。"]}, {"label": "輸出需求", "lines": ["重繪為白底黑線、橫式2∶1；交付2400×1200 PNG。", "隨圖提供一句文字說明，交代同向增強、等大反向相消與適用條件。"]}], "reminder": "使用提醒：涉及實拍、模型或示意時，請在畫面中明確標示。", "image": {"src": "07B_image1.png", "caption": "對應圖片：同向與反向脈衝完全重疊比較圖。以下為構圖示範。", "note": "補充標註：上下分區避免把分波與合成繩形誤認成三條繩子；兩欄共用相同刻度。"}}, {"title": "波的疊加動畫影片需求腳本示範", "intro": "每個鏡頭填一列，可增刪。本例規劃36秒動畫；旁白同時作字幕，無配樂。", "fields": [{"label": "基本資料", "lines": ["兩個脈衝相遇的兩種案例；高中物理。"]}, {"label": "知識節點與使用目的", "lines": ["知識節點：疊加與通過後狀態。配合第1節學習單Q1–Q3，讓學生說明脈衝相遇前後的變化。"]}], "shots_note": "分鏡內容　草圖上區為分波模型，下區為合成繩形；A細實線、B虛線，箭頭表示傳播方向。", "shots_header": ["編號\n時間", "畫面內容或草圖", "旁白與字幕", "動作與轉場", "備註與素材"], "shots": [{"no": "01\n0–6秒", "scene": "A、B兩個向上脈衝分置左右。分波在上、合成繩形在下，標平衡位置。", "img": "07B_image2.png", "narration": "「在理想線性介質中，兩個相同脈衝正相向傳播。」", "action": "先定格標示，再同步向中央移動。箭頭僅表示傳播方向。", "note": "單峰脈衝；統一座標尺度。"}, {"no": "02\n6–14秒", "scene": "呈現完全重疊；P點顯示＋1、＋1，合成＋2。", "img": "07B_image3.png", "narration": "「同一位置的位移相加。同向重疊時，這裡的合成位移變大。」", "action": "抵達中央後定格2秒；配合旁白依序顯示三個數值。", "note": "相對單位；字幕與數值同步。"}, {"no": "03\n14–20秒", "scene": "恢復移動，A到右側、B到左側，維持原形狀與方向。", "img": "07B_image4.png", "narration": "「通過之後，兩個脈衝仍各自向原方向傳播。」", "action": "不中斷追蹤A、B標籤；固定視角。", "note": "保留標籤，不交換分波身分。"}, {"no": "04\n20–28秒", "scene": "切換到一上一下的等大脈衝；完全重疊時合成繩形為平線。", "img": "07B_image5.png", "narration": "「改成等大反向時，位移抵銷，完全重疊當下合成位移為零。」", "action": "標明「新案例」後重新播放；中央定格2秒。", "note": "同寬、同速；P點顯示＋1－1＝0。"}, {"no": "05\n28–36秒", "scene": "接續通過後畫面；平線重新分成向上與向下的兩個脈衝。", "img": "07B_image6.png", "narration": "「零位移只描述這一瞬間；不代表波或能量永久消失。」", "action": "A、B沿原方向離開；最後停留總結文字2秒。", "note": "尾字：「重疊暫時，通過後各自傳播」。"}], "misread": ["相消後立即切走容易被誤認成永久消失，須連續播到兩脈衝通過後。分波為輔助表示，合成繩形另區顯示。", "「新案例」先標明再切換；停格註明為教學定格，避免被理解成波真的停止。"], "output": "輸出需求：MP4／1920×1080／16∶9／36秒，另附字幕文字檔；依據第1節學習單Q1–Q3，時長為示範設定。"}, {"title": "波的疊加模擬需求腳本示範", "intro": "每個模擬填一份；操作表每列一項功能。本例為改作需求，新增設定尚未實作。", "fields": [{"label": "基本資料", "lines": ["可調脈衝高度的疊加模擬。", "適用：高中物理；編寫者：＿＿＿＿。"]}, {"label": "知識節點與使用目的", "lines": ["節點：位移代數和、通過後狀態。", "配合第1節學習單Q1–Q3，先預測，再調整脈衝高度比較結果。"]}, {"label": "初始畫面與參數", "lines": ["上區顯示分波A、B，下區顯示合成繩形；標平衡位置及中央觀察點P。初始靜止待播放。", "A、B的帶符號脈衝高度：初值均＋1，範圍－1.5～＋1.5、步進0.1，採相對單位。", "兩個單峰脈衝同形、等寬，中心在畫面25%、75%；寬度與波速固定。"]}, {"label": "變化規則", "lines": ["同一位置、同一時刻的合成位移＝A的位移＋B的位移。A、B以等速相向傳播，通過後各自保持原形狀與方向。", "採理想線性介質，忽略反射及衰減；視窗外不反彈回來。"]}], "params_header": ["參數名稱", "設定權限", "預設值與單位", "範圍與步進", "作用與限制"], "params": [["脈衝高度 A", "學生可調", "＋1\n相對單位", "−1.5～＋1.5\n步進 0.1", "含正負號；調整後回到起始畫面。"], ["脈衝高度 B", "學生可調", "＋1\n相對單位", "−1.5～＋1.5\n步進 0.1", "含正負號；調整後回到起始畫面。"], ["波形與寬度", "程式固定", "同形單峰\n全寬為畫面20%", "固定值", "兩波等寬；不提供學生控制項。"], ["波速", "程式固定", "每秒5%\n畫面寬度", "固定值", "A向右、B向左等速；不提供學生控制項。"], ["起始位置", "程式固定", "A：25%\nB：75%\n畫面位置", "固定值", "重設或切換案例時恢復起始位置。"], ["座標與觀察點", "程式固定", "位移：−3～＋3\n相對單位\nP：畫面50%", "固定值", "固定刻度，避免曲線自動縮放造成誤判。"]], "params_note": "本例新增的全寬20%、波速每秒5%與位移刻度為需求示範設定，尚未實作。", "ops_header": ["操作項目", "操作與條件", "畫面結果與回饋"], "ops": [["調整脈衝高度", "A、B各一個滑桿；調整後回到起始畫面。", "曲線同步改變；顯示帶正負號的高度數值。"], ["播放與暫停", "播放後A向右、B向左等速傳播；暫停時固定時間。", "P點即時列出兩分位移與合成值；通過後方向不變。"], ["切換案例", "同向：＋1、＋1；反向：＋1、－1。\n切換時重置位置。", "完全重疊時P點分別為＋2或0。"], ["重設", "恢復A、B高度＋1，起始位置25%、75%，時間歸零。", "回到未播放狀態；保留模型說明與操作按鈕。"]], "misread": ["負值表示脈衝向下，不稱為「負振幅」；控制項命名為「脈衝高度（含正負號）」。", "分波線不是三條實體繩子，須與合成繩形分區；位移為零時仍接續呈現通過後狀態。"], "output": "交付離線HTML，支援電腦與平板；附操作文字及相遇前、重疊、通過後三張靜態圖。", "image": {"src": "07B_image7.png", "caption": "介面草圖示範：同向案例在完全重疊當下暫停；編號對應畫面區域。", "note": "圖中①②為波形顯示，③為學生操作，④⑤為唯讀資訊；此圖為介面草圖。"}}]}}, "worksheets": {"1": {"lesson": 1, "pending": true, "questions": [{"id": "Q1", "label": "Q1", "plan_ref": "Q1預測", "lock": true, "parts": [{"id": "x", "type": "text", "lines": 3}]}, {"id": "Q2", "label": "Q2", "plan_ref": "Q2畫圖", "parts": [{"id": "d", "type": "draw"}, {"id": "x", "type": "text", "lines": 2}]}, {"id": "Q3", "label": "Q3", "plan_ref": "Q3用疊加解釋。", "parts": [{"id": "x", "type": "text", "lines": 3}]}, {"id": "Q4", "label": "Q4", "plan_ref": "Q4預測", "lock": true, "parts": [{"id": "x", "type": "text", "lines": 3}]}, {"id": "Q5", "label": "Q5", "plan_ref": "Q5選點", "parts": [{"id": "x", "type": "text", "lines": 2}]}, {"id": "Q6", "label": "Q6", "plan_ref": "Q6比較結果。", "parts": [{"id": "x", "type": "text", "lines": 3}]}, {"id": "Q7", "label": "Q7", "plan_ref": "Q7寫水波CER", "parts": [{"id": "x", "type": "text", "lines": 5}]}, {"id": "Q8", "label": "Q8", "plan_ref": "Q8寫想法改變。", "parts": [{"id": "x", "type": "text", "lines": 3}]}]}, "2": {"lesson": 2, "source": "教材來源：第2節「光的雙狹縫干涉」紙本學習單修訂版。保留原Q1–Q6，作答格式與時間為本示範的安排。", "teacher": {"overview": [{"label": "對應知識節點", "lines": ["核心教材示範版節點02「雙狹縫干涉」。", "先備：節點01「波的疊加與水波干涉」，能區分位移、振幅及建設性／破壞性干涉。"]}, {"label": "學習目標與產出", "lines": ["從Q2的觀察紀錄，看學生能否描述屏幕明暗分布並辨識資料來源。", "從Q3的比較，看學生能否依觀察保留或修正預測。", "從Q4、Q6的解釋，看學生能否以光波疊加說明亮暗紋；從Q5看其是否能區分水波與光的可觀察量。"]}], "sequence": [{"no": "01", "name": "先預測", "task": "Q1：畫出屏幕預測並保留理由。", "time": "8分鐘"}, {"no": "02", "name": "觀察與比較", "task": "Q2–Q3：記錄來源、觀察特徵，與預測比較。", "time": "12分鐘"}, {"no": "03", "name": "解釋亮暗", "task": "Q4：用兩個相干次波源解釋亮紋與暗紋。", "time": "15分鐘"}, {"no": "04", "name": "比較與統整", "task": "Q5–Q6：比較水波與光，再寫完整解釋。", "time": "15分鐘"}]}, "activities": {"act01": {"title": "活動01　先預測（8分鐘）", "context": "一束穩定紅色雷射光通過相近的雙狹縫，遠方屏幕會出現什麼分布？本節先作定性預測。", "materials": "使用紙本與筆；先保留自己的預測與理由，再進行實際觀察。學生尚未完成Q1時，先不展示屏幕結果或開啟模擬。"}, "act02": {"title": "活動02　觀察與比較（12分鐘）", "context": "先記錄屏幕實際亮暗分布，再與Q1的預測比較。", "materials": "教師示範，或提供可回查來源的雙狹縫實拍照片／影片；無設備時使用列印照片。模擬只協助辨認規律。雷射由教師操作，不直視、不指向他人或鏡面。"}, "act03": {"title": "活動03　解釋亮暗（15分鐘）", "context": "B代表亮紋位置，D代表暗紋位置。以同偏振、相干且在觀察處等振幅的兩列光波作理想化討論。", "materials": "使用原教材雙狹縫波面模型或離線模擬。先說明窄縫可視為次波源；「相干」指同頻率且相位關係固定，「相位」描述振動進行的階段。模型用來解釋Q2的觀察。"}, "act04": {"title": "活動04　比較與統整（15分鐘）", "context": "連結前一節水波干涉經驗，整理光的雙狹縫干涉，說清楚兩種現象的共同規則與差異。", "materials": "回看第1節水波紀錄，以及本節Q2的觀察與Q4的解釋。使用既有紀錄作答；區分真實觀察與模型，不新增公式。"}}, "questions": [{"id": "R1", "label": "修訂第1節Q7", "revise_of": {"lesson": 1, "q": "Q7"}, "plan_ref": "檢查證據與推理，修訂第1節Q7。"}, {"id": "Q1", "label": "Q1", "activity": "act01", "prompt": "你預測屏幕上會看到什麼？先勾選，再畫出中央與左右兩側的明暗分布，並寫出一項理由。深色代表暗，留白代表亮。", "lock": true, "parts": [{"id": "c", "type": "choice", "options": ["主要只有兩條亮紋", "整片亮度差不多", "多條明暗相間的條紋", "其他："]}, {"id": "d", "type": "draw", "label": "我的屏幕圖樣預測（請在下方作圖）："}, {"id": "r", "type": "text", "label": "我這樣預測，因為：", "lines": 1}], "teacher": {"answer": ["Q1不以預測正誤評分。完成要素為：畫出面向屏幕的完整分布，並保留至少一項可理解的理由。即使預測兩條亮紋，只要理由清楚，也可進入觀察活動。"], "errors": ["若只畫兩條狹縫，追問：「這是開口的樣子，還是屏幕上看到的樣子？」", "若先擦掉預測，提醒：「請保留初稿，等觀察後再比較。」"]}}, {"id": "Q2", "label": "Q2", "activity": "act02", "prompt": "勾選資料來源，畫出中央與左右兩側的明暗分布，並寫出兩個觀察特徵。", "parts": [{"id": "c", "type": "choice", "options": ["現場示範", "有來源的實拍照片／影片", "僅理想模型"]}, {"id": "d", "type": "draw", "label": "我的觀察（請在下方作圖）："}, {"id": "f1", "type": "text", "label": "特徵一：", "lines": 1}, {"id": "f2", "type": "text", "label": "特徵二：", "lines": 1}], "teacher": {"answer": ["Q2：依所用資料描述兩項特徵，例如明暗交替、左右近似對稱；中央附近亮紋間距近似相等。僅觀看模型時，應標為模型結果。"], "errors": ["若以波面弧線當屏幕實拍，追問：「這個畫面是實際紀錄，還是用來解釋的模型？」"]}}, {"id": "Q3", "label": "Q3", "activity": "act02", "prompt": "與Q1比較後，你保留或修正哪一點？請引用一項觀察。", "parts": [{"id": "c", "type": "choice", "options": ["大致相同", "部分相同", "不同"]}, {"id": "k", "type": "text", "label": "我保留／修正", "lines": 1}, {"id": "e", "type": "text", "label": "依據是", "lines": 1}], "teacher": {"answer": ["Q3：指出保留或修改的內容，且能連到觀察；不要求每人一定改變想法。"], "errors": ["若只寫「不同」，追問：「哪個觀察讓你修改哪一部分？」"]}}, {"id": "Q4", "label": "Q4", "activity": "act03", "prompt": "依兩個相干次波源的模型，完成B與D兩處的判斷。", "parts": [{"id": "bp", "type": "choice", "group": "B亮紋：", "label": "相位", "options": ["同相", "反相"]}, {"id": "bi", "type": "choice", "group": "B亮紋：", "label": "干涉", "options": ["建設性", "破壞性"]}, {"id": "bs", "type": "choice", "group": "B亮紋：", "label": "光強", "options": ["較強", "理想下為零"]}, {"id": "dp", "type": "choice", "group": "D暗紋：", "label": "相位", "options": ["同相", "反相"]}, {"id": "di", "type": "choice", "group": "D暗紋：", "label": "干涉", "options": ["建設性", "破壞性"]}, {"id": "ds", "type": "choice", "group": "D暗紋：", "label": "光強", "options": ["較強", "理想下為零"]}, {"id": "x", "type": "text", "label": "請用2–3句說明：兩列光波都能到達屏幕，為何仍有亮紋與暗紋？", "lines": 3}], "teacher": {"key": {"bp": "同相", "bi": "建設性", "bs": "較強", "dp": "反相", "di": "破壞性", "ds": "理想下為零"}, "answer": ["B：同相、建設性干涉、光強較強。D：反相、破壞性干涉，等振幅理想情況下光強為零。", "判讀重點：學生是否以相位關係及疊加解釋明暗，而非只寫亮暗名稱。實際暗紋可能受背景光或振幅不等影響。"], "errors": ["若認為D處沒有任何光波到達，追問：「從兩條狹縫出發的波能否都到達D？到達後如何疊加？」", "若說能量消失，追問：「其他屏幕位置的亮度有何變化？」"]}}, {"id": "Q5", "label": "Q5", "activity": "act04", "prompt": "比較水波干涉與光的雙狹縫干涉，各寫一項可觀察的量，再寫一項共同規則。", "parts": [{"id": "w", "type": "text", "label": "水波可觀察：", "lines": 1}, {"id": "l", "type": "text", "label": "光的雙狹縫可觀察：", "lines": 1}, {"id": "r", "type": "text", "label": "共同規則：", "lines": 1}], "teacher": {"answer": ["Q5：水波可看水面起伏；屏幕呈現時間平均的光強分布。共同規則為波的疊加與建設性／破壞性干涉。"], "errors": ["若把水面瞬時位移直接當成光強，追問：「兩種活動各自直接看到的是什麼？」"]}}, {"id": "Q6", "label": "Q6", "activity": "act04", "prompt": "請用4–5句解釋雙狹縫亮暗紋。依序說明：兩個次波源 → 光波疊加 → 亮紋 → 暗紋 → 與Q2觀察的連結。", "parts": [{"id": "x", "type": "text", "lines": 5}], "teacher": {"answer": ["Q6參考：兩窄縫可視為相干次波源。兩列光波在屏幕各處疊加。同相處增強形成亮紋。反相處減弱，等振幅時可完全相消形成暗紋。這可解釋Q2的明暗分布；若Q2僅模型，應註明尚待實際觀察支持。"], "errors": ["若Q6只有名詞列表，追問：「請用『因為……所以……』連起相位、疊加與亮暗。」"]}}]}, "3": {"lesson": 3, "pending": true, "questions": [{"id": "R2", "label": "修訂第2節Q6", "revise_of": {"lesson": 2, "q": "Q6"}, "plan_ref": "修訂第2節Q6，補上證據或推理。"}, {"id": "Q1", "label": "Q1", "plan_ref": "完成Q1；口頭比較單、雙狹縫。", "parts": [{"id": "x", "type": "text", "lines": 4}]}, {"id": "Q3", "label": "Q3", "plan_ref": "Q3指出上下表面的反射光及干涉。", "parts": [{"id": "x", "type": "text", "lines": 3}]}, {"id": "Q5a", "label": "Q5①", "plan_ref": "Q5①連結觀察、次波疊加與波動性。", "parts": [{"id": "x", "type": "text", "lines": 5}]}, {"id": "Q5b", "label": "Q5②", "plan_ref": "Q5②寫前後想法；下載完整紀錄。", "parts": [{"id": "x", "type": "text", "lines": 4}]}]}}, "assessments": {"posttest": {"id": "posttest", "title": "後測", "pending_items": true, "info": [{"label": "科目與評量", "value": "高中物理／高一；評量：干涉與繞射後測。"}, {"label": "評量範圍", "value": "完整三節單元；完成三節課教學後施測。"}, {"label": "時間與總量", "value": "25～30分鐘；共14題；總分30分。"}], "declared": {"items": 14, "points": 30}, "rows": [{"objective": "運用疊加並說明通過後狀態", "levels": {"了解": [1], "應用": [2, 7], "分析": [10]}, "points": 7}, {"objective": "判讀同調條件與水波干涉", "levels": {"了解": [4], "應用": [8]}, "points": 3}, {"objective": "說明雙狹縫相干次波源", "levels": {"了解": [5]}, "points": 1}, {"objective": "區分瞬時位移與振幅", "levels": {"了解": [3]}, "points": 1}, {"objective": "比較單雙縫圖樣與次波源分布", "levels": {"了解": [9, 12], "分析": [13]}, "points": 9}, {"o <script>/* AI 教科書平台：前端程式（學生版／教師版共用，由 tools/build.py 注入內容）
 * 介面按鈕與提示是平台用語；教材文字全部來自 units/ 內容檔（已逐字比對原始檔）。 */
(function () {
  "use strict";
  const TB = window.TB;
  const T = TB.mode === "teacher";
  const $app = document.getElementById("app");
  const PENDING = "待補";

  // ---------- 小工具 ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const pre = (s, cls) => h("div", { class: "pre " + (cls || "") }, s);
  const now = () => new Date().toISOString();
  const teacherBox = (label, ...kids) => T ? h("div", { class: "teacher" }, h("div", { class: "tl" }, "教師版　" + label), ...kids) : null;
  const pendingBox = (what, extra) => h("div", { class: "pending-box" }, h("b", null, PENDING + "　"), what, extra ? h("div", { class: "small muted pre" }, extra) : null);
  function kvTable(rows) {
    return h("div", { class: "tablewrap" }, h("table", { class: "kv" }, rows.map(r => h("tr", null, h("th", null, r.label), h("td", null, r.value)))));
  }
  function table(header, rows) {
    return h("div", { class: "tablewrap" }, h("table", null,
      header ? h("thead", null, h("tr", null, header.map(x => h("th", null, x)))) : null,
      h("tbody", null, rows.map(r => h("tr", null, r.map(c => h("td", null, c)))))));
  }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function storeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function storeKeys(prefix) { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) out.push(k); } } catch (e) {} return out; }
  function download(name, text, type) {
    const blob = new Blob([text], { type: type || "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  // 兩段式確認（不用瀏覽器確認對話框，嵌入框架中也能運作）
  function confirmBtn(label, ask, action, cls) {
    let armed = false, timer = 0;
    const b = h("button", { class: cls || "", onclick: () => {
      if (!armed) { armed = true; b.textContent = ask; b.classList.add("primary"); timer = setTimeout(() => { armed = false; b.textContent = label; if (!cls) b.classList.remove("primary"); }, 4000); return; }
      clearTimeout(timer); action();
    } }, label);
    return b;
  }
  const unitById = id => TB.units.find(u => u.meta.id === id);

  // ---------- 學生代碼與作答紀錄 ----------
  const SID_KEY = "tb:sid";
  function sid() { return store(SID_KEY) || ""; }
  function recKey(u, n) { return `tb:rec:${u.meta.id}:${sid()}:L${n}`; }
  function getRec(u, n) {
    let r = store(recKey(u, n));
    if (!r) r = { schema: "tb-record/1", student_code: sid(), unit: u.meta.id, unit_title: u.meta.title, lesson: n,
      material_version: u.meta.material_version, site_build: TB.built_at, started_at: now(), updated_at: now(),
      items: {}, ops: [], hints: [], handoff: [] };
    return r;
  }
  function saveRec(u, n, r) { r.updated_at = now(); store(recKey(u, n), r); }
  function logOp(u, n, type, detail) { if (T) return; const r = getRec(u, n); r.ops.push({ at: now(), type, detail }); saveRec(u, n, r); }
  function recFileName(u, n) { return `${sid() || "未填代碼"}_${u.meta.title}_第${n}節.json`; }

  function askSid(force) {
    if (T) return;
    if (sid() && !force) return;
    const inp = h("input", { type: "text", placeholder: "例如：10512", value: sid() });
    const bg = h("div", { class: "modal-bg" }, h("div", { class: "modal" },
      h("h3", null, "輸入學生代碼"),
      h("p", { class: "small muted" }, "作答會用這個代碼暫存在這台裝置的瀏覽器，下載的紀錄檔也以它命名。不需要帳號。"),
      inp,
      h("div", { class: "toolbar" }, h("button", { class: "primary", onclick: () => {
        const v = inp.value.trim().replace(/[\\/:*?"<>|\s]/g, "");
        if (!v) { inp.focus(); return; }
        store(SID_KEY, v); bg.remove(); route();
      } }, "開始"))));
    document.body.append(bg); inp.focus();
  }
  function clearLocal() {
    storeKeys("tb:").forEach(storeDel);
    location.hash = "#/"; route();
  }

  // ---------- 外框 ----------
  function shell(u, active, content) {
    $app.innerHTML = "";
    const top = h("div", { class: "topbar" },
      h("a", { href: "#/", class: "brand", style: "text-decoration:none;color:inherit" }, "AI 教科書"),
      h("span", { class: "mode " + (T ? "t" : "") }, T ? "教師版" : "學生版"),
      h("span", { class: "spacer" }),
      !T ? h("span", { class: "sid" }, "學生代碼：", sid() || "（未填）", " ", h("button", { class: "link", onclick: () => askSid(true) }, "變更")) : null,
      !T ? confirmBtn("清除本機紀錄", "確定清除？紀錄無法復原（再按一次）", clearLocal) : null);
    const side = u ? sideNav(u, active) : null;
    const main = h("main", null, content);
    $app.append(top, u ? h("div", { class: "layout" }, side, main) : h("div", { class: "layout", style: "grid-template-columns:1fr;max-width:1000px" }, main));
    window.scrollTo(0, 0);
  }
  function sideNav(u, active) {
    const id = u.meta.id; const L = (href, label, key, cls) => h("a", { href: `#/u/${id}${href}`, class: (active === key ? "on " : "") + (cls || "") }, label);
    return h("nav", { class: "side" },
      h("div", { class: "sec" }, u.meta.title),
      L("", "單元首頁", "home"),
      L("/test/pretest", "前測", "pretest"),
      u.meta.lessons.map(l => L(`/lesson/${l.n}`, l.title, "L" + l.n)),
      L("/test/posttest", "後測", "posttest"),
      L("/extension", "延伸學習", "ext"),
      L("/assets", "素材庫", "assets"),
      L("/print", "列印中心", "print"),
      T ? [h("div", { class: "sec" }, "教師版"),
        L("/design", "單元教學設計", "design", "t"),
        L("/blueprint", "雙向細目表", "blueprint", "t"),
        L("/misconceptions", "學習困難速查", "mis", "t"),
        L("/grade", "匯入作答與批改", "grade", "t")] : null);
  }

  // ---------- 平台首頁 ----------
  function pageHome() {
    const fields = [...new Set(TB.units.map(u => u.meta.field))], grades = [...new Set(TB.units.map(u => u.meta.grade))];
    let ff = "", gf = "";
    const list = h("div", { class: "grid" });
    function draw() {
      list.innerHTML = "";
      TB.units.filter(u => (!ff || u.meta.field === ff) && (!gf || u.meta.grade === gf)).forEach(u => list.append(
        h("a", { href: `#/u/${u.meta.id}`, class: "card", style: "text-decoration:none;color:inherit;display:block" },
          h("div", { class: "small muted" }, u.meta.field, "｜", u.meta.grade),
          h("h3", { style: "margin:.2rem 0" }, u.meta.title),
          h("div", { class: "small" }, u.meta.lessons.map(l => l.title).join("\n")))));
    }
    const sel = (opts, set) => h("select", { style: "width:auto", onchange: e => { set(e.target.value); draw(); } }, h("option", { value: "" }, "全部"), opts.map(o => h("option", { value: o }, o)));
    shell(null, null, [h("h1", null, "單元清單"),
      h("div", { class: "toolbar" }, "領域：", sel(fields, v => ff = v), "　年級：", sel(grades, v => gf = v)),
      list]);
    draw();
  }

  // ---------- 單元首頁 ----------

  // ---------- 07B 疊加模擬（依 07B 需求腳本） ----------
  function superposeSim(u, lesson) {
    const W = 900, H = 360;
    const cv = h("canvas", { width: W, height: H });
    const ctx = cv.getContext("2d");
    let hA = 1, hB = 1, t = 0, playing = false, last = 0, raf = 0;
    const width = 0.2, speed = 0.05; // 全寬 20%；每秒 5% 畫面寬度
    const pulse = (x, c, a) => Math.abs(x - c) < width / 2 ? a * (1 + Math.cos(Math.PI * (x - c) / (width / 2))) / 2 : 0;
    const yA = x => pulse(x, 0.25 + speed * t, hA), yB = x => pulse(x, 0.75 - speed * t, hB);
    const fmt = v => (v > 0.0001 ? "＋" : v < -0.0001 ? "－" : "") + Math.abs(v).toFixed(2);
    const readout = h("div", { class: "readout" });
    function plot(y0, hh, fn, style) {
      ctx.save(); ctx.strokeStyle = "#111"; ctx.lineWidth = style.w; ctx.setLineDash(style.dash || []);
      ctx.beginPath();
      for (let i = 0; i <= 600; i++) { const x = i / 600, px = 40 + x * (W - 60), py = y0 - fn(x) / 3 * (hh / 2); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke(); ctx.restore();
    }
    function frame() {
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
      ctx.font = "14px sans-serif"; ctx.fillStyle = "#333";
      const regions = [{ y: 90, hh: 150, label: "分波 A、B" }, { y: 270, hh: 150, label: "合成繩形" }];
      regions.forEach(r => {
        ctx.strokeStyle = "#bbb"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(40, r.y); ctx.lineTo(W - 20, r.y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillText(r.label, 44, r.y - r.hh / 2 + 14); ctx.fillStyle = "#888"; ctx.fillText("平衡位置", W - 80, r.y - 4);
        [-3, 3].forEach(v => ctx.fillText((v > 0 ? "＋" : "－") + "3", 6, r.y - v / 3 * (r.hh / 2) + 5)); ctx.fillStyle = "#333";
      });
      const px = 40 + 0.5 * (W - 60);
      ctx.strokeStyle = "#c33"; ctx.beginPath(); ctx.moveTo(px, 10); ctx.lineTo(px, H - 10); ctx.stroke(); ctx.fillStyle = "#c33"; ctx.fillText("P", px + 4, 24); ctx.fillStyle = "#333";
      plot(90, 150, yA, { w: 1.5 }); plot(90, 150, yB, { w: 1.5, dash: [7, 5] });
      ctx.fillText("A（細實線）", 0.25 * (W - 60) + 20 + speed * t * (W - 60), 40);
      ctx.fillText("B（虛線）", 0.75 * (W - 60) + 10 - speed * t * (W - 60), 40);
      plot(270, 150, x => yA(x) + yB(x), { w: 3.5 });
      ctx.fillStyle = "#666"; ctx.fillText("理想線性介質中的模型示意", 44, H - 8);
      const a = yA(0.5), b = yB(0.5);
      readout.textContent = `P點：A ${fmt(a)}　B ${fmt(b)}　合成 ${fmt(a + b)}　（t = ${t.toFixed(1)} 秒）`;
    }
    function tick(ts) { if (!playing) return; if (last) t += (ts - last) / 1000; last = ts; if (t > 18) { t = 18; playing = false; playBtn.textContent = "播放"; } frame(); if (playing) raf = requestAnimationFrame(tick); }
    function reset(keepH) { playing = false; cancelAnimationFrame(raf); t = 0; last = 0; if (!keepH) { hA = 1; hB = 1; sA.value = 1; sB.value = 1; } lab(); playBtn.textContent = "播放"; frame(); }
    const playBtn = h("button", { class: "primary", onclick: () => {
      playing = !playing; playBtn.textContent = playing ? "暫停" : "播放"; last = 0;
      if (lesson) logOp(u, lesson, playing ? "模擬播放" : "模擬暫停", `A=${hA},B=${hB},t=${t.toFixed(1)}`);
      if (playing) raf = requestAnimationFrame(tick);
    } }, "播放");
    const mk = () => h("input", { type: "range", min: -1.5, max: 1.5, step: 0.1, value: 1, style: "width:100%" });
    const sA = mk(), sB = mk(), lA = h("span"), lB = h("span");
    const lab = () => { lA.textContent = fmt(hA).replace(".00", ""); lB.textContent = fmt(hB).replace(".00", ""); };
    sA.oninput = () => { hA = +sA.value; reset(true); }; sB.oninput = () => { hB = +sB.value; reset(true); };
    sA.onchange = sB.onchange = () => lesson && logOp(u, lesson, "調整脈衝高度", `A=${hA},B=${hB}`);
    const kase = (a, b, name) => h("button", { onclick: () => { hA = a; hB = b; sA.value = a; sB.value = b; reset(true); lesson && logOp(u, lesson, "切換案例", name); } }, name);
    lab(); frame();
    return h("div", { class: "sim" }, cv,
      h("div", { class: "ctl" },
        h("label", null, "脈衝高度 A（含正負號）：", lA, sA),
        h("label", null, "脈衝高度 B（含正負號）：", lB, sB)),
      h("div", { class: "toolbar" }, playBtn, kase(1, 1, "同向"), kase(1, -1, "反向"), h("button", { onclick: () => { reset(false); lesson && logOp(u, lesson, "模擬重設", ""); } }, "重設")),
      readout);
  }

  // ---------- 內容元件：畫板 ----------
  function drawPad(value, onSave, disabled) {
    const cv = h("canvas", { class: "pad", width: 640, height: 200 });
    const ctx = cv.getContext("2d");
    function paintBg() { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.strokeStyle = "#ddd"; ctx.beginPath(); ctx.moveTo(cv.width / 2, 0); ctx.lineTo(cv.width / 2, cv.height); ctx.stroke(); ctx.fillStyle = "#aaa"; ctx.font = "12px sans-serif"; ctx.fillText("中央", cv.width / 2 + 4, 14); ctx.fillText("左側", 6, 14); ctx.fillText("右側", cv.width - 34, 14); }
    paintBg();
    if (value) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = value; }
    let down = false, eraser = false, lx = 0, ly = 0;
    const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    if (!disabled) {
      cv.addEventListener("pointerdown", e => { down = true; [lx, ly] = pos(e); cv.setPointerCapture(e.pointerId); });
      cv.addEventListener("pointermove", e => { if (!down) return; const [x, y] = pos(e); ctx.strokeStyle = eraser ? "#fff" : "#111"; ctx.lineWidth = eraser ? 22 : 6; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke(); lx = x; ly = y; });
      const up = () => { if (down) { down = false; onSave(cv.toDataURL("image/png")); } };
      cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    }
    const penB = h("button", { onclick: () => { eraser = false; penB.className = "primary"; erB.className = ""; } , class: "primary" }, "畫筆（深色＝暗）");
    const erB = h("button", { onclick: () => { eraser = true; erB.className = "primary"; penB.className = ""; } }, "橡皮擦");
    return h("div", null, disabled ? null : h("div", { class: "padbar" }, penB, erB, h("button", { onclick: () => { paintBg(); onSave(""); } }, "全部清除")), cv);
  }

  // ---------- 學習單題目 ----------
  function partsFilled(q, parts) {
    if (!q.parts) return !!(parts && parts.x && parts.x.trim());
    return q.parts.every(p => {
      const v = parts && parts[p.id];
      if (p.type === "draw") return true; // 作圖不強制
      if (p.type === "choice") return !!v;
      return !!(v && String(v).trim());
    });
  }
  function anyFilled(parts) { return parts && Object.values(parts).some(v => v && String(v).trim()); }
  function renderParts(q, parts, onChange, ro) {
    const out = [];
    let lastGroup = null, grid = null;
    (q.parts || [{ id: "x", type: "text", lines: 4 }]).forEach(p => {
      const val = parts[p.id] || "";
      if (p.type === "choice") {
        const name = "c" + Math.random().toString(36).slice(2);
        const opts = h("div", { class: "opts" }, p.options.map(o => h("label", null,
          h("input", { type: "radio", name, value: o, checked: val === o, disabled: ro, onchange: () => onChange(p.id, o) }), o,
          o === "其他：" ? h("input", { type: "text", style: "width:10rem", value: parts[p.id + "_other"] || "", disabled: ro, oninput: e => onChange(p.id + "_other", e.target.value) }) : null)));
        if (p.group) {
          if (p.group !== lastGroup) { grid = h("div", { class: "choice-grid" }); out.push(h("div", { class: "part" }, grid)); lastGroup = p.group; grid.append(h("b", null, p.group)); } else grid.append(h("span"));
          grid.append(h("span", null, p.label), opts);
        } else out.push(h("div", { class: "part" }, p.label ? h("label", { class: "pl" }, p.label) : null, opts));
      } else if (p.type === "draw") {
        out.push(h("div", { class: "part" }, p.label ? h("label", { class: "pl" }, p.label) : h("label", { class: "pl" }, "作圖區"), drawPad(val, d => onChange(p.id, d), ro)));
      } else {
        const ta = h("textarea", { rows: Math.max(1, p.lines || 3), disabled: ro, oninput: e => onChange(p.id, e.target.value) }); ta.value = val;
        out.push(h("div", { class: "part" }, p.label ? h("label", { class: "pl" }, p.label) : null, ta));
      }
    });
    return out;
  }
  function partsSummary(q, parts) {
    if (!parts) return "（未作答）";
    return (q.parts || [{ id: "x", type: "text" }]).map(p => {
      const v = parts[p.id];
      if (p.type === "draw") return v ? "［作圖］" : "";
      const lab = (p.group || "") + (p.label || "");
      return v ? (lab ? lab + " " : "") + v + (parts[p.id + "_other"] ? " " + parts[p.id + "_other"] : "") : "";
    }).filter(Boolean).join("\n") || "（未作答）";
  }

        : h("button", { class: "primary", onclick: () => { const cur = item(); cur.draft = { parts: JSON.parse(JSON.stringify(cur.parts)), at: now() }; setItem(cur); logOp(u, lesson, "儲存初稿", q.id); draw(); } }, "儲存初稿");

  function hintBlock(u, lesson, mid, qids, withAI) {

    if (m.hints_pending || !m.hints) {
      return h("div", null, h("div", { class: "pending-box" }, h("b", null, "分層提示 L1–L3 " + PENDING), "　", m.name), tq);

    const levels = ["L1", "L2", "L3"];
    function used() { if (T) return 3; return getRec(u, lesson).hints.filter(x => x.misconception === mid && x.source === "fixed").map(x => x.level); }
    function ready() { if (T) return true; const r = getRec(u, lesson); return qids.some(id => r.items[id] && anyFilled(r.items[id].parts)); }
    function draw() {
      wrap.innerHTML = "";
      const u_ = T ? levels : levels.filter(l => used().includes(l));
      wrap.append(h("div", null, h("b", null, "提示"), h("span", { class: "small muted" }, "　一次給一層提示，先想想再看下一層。")));
      u_.forEach(l => wrap.append(h("div", { class: "row" }, h("span", { class: "lv" }, u.misconceptions.levels[l]), pre(m.hints[l]))));
      if (!T) {

  function projection(u, n) {
    const L = u.plan.lessons.find(x => x.n === n);
    const steps = [...document.querySelectorAll("section.step[data-step]")];
    let si = 0, bi = 0;
    const view = h("div", { class: "proj" });
    function blocksOf(i) { return [...steps[i].querySelector(".body").children].filter(c => !c.classList.contains("teacher")); }
    function draw() {
      view.innerHTML = "";
      const s = L.steps[si];
      view.append(h("div", { class: "muted" }, L.title), h("h1", null, s.name, "　", h("span", { class: "muted", style: "font-size:1.2rem" }, s.time)));
      blocksOf(si).forEach((b, i) => { const c = b.cloneNode(true); c.querySelectorAll(".teacher").forEach(x => x.remove()); if (i > bi) c.classList.add("hidden-block"); view.append(c); });
      view.append(h("div", { class: "projbar" },
        h("button", { onclick: back }, "上一項"), h("button", { class: "primary", onclick: next }, "揭示下一項"),
        h("span", { class: "muted", style: "align-self:center" }, `${si + 1}/${steps.length}`), h("button", { onclick: close }, "離開投影")));
    }
    function next() { if (bi < blocksOf(si).length - 1) bi++; else if (si < steps.length - 1) { si++; bi = 0; } draw(); }
    function back() { if (bi > 0) bi--; else if (si > 0) { si--; bi = blocksOf(si).length - 1; } draw(); }
    function key(e) { if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); } else if (e.key === "ArrowLeft") back(); else if (e.key === "Escape") close(); }
    function close() { view.remove(); document.removeEventListener("keydown", key); }
    document.addEventListener("keydown", key);
    document.body.append(view); draw();
  }

        kvTable([{ label: "專業說明", value: L.teacher.expert }, { label: "條件與誤解", value: L.teacher.caveats }])]),
      h("h2", null, "五　評量與學習記錄"),
      table(["評量時機", "學生任務／題目", "判斷標準", "記錄位置"], p.teacher.assessment.map(a => [a.when, a.task, a.criteria, a.where])),
      kvTable([{ label: "數位記錄", value: p.teacher.digital_record }]),
      h("h2", null, "六　附件與交付"),
      table(["序", "附件／素材名稱", "用途／使用位置", "作者／來源授權"], p.teacher.attachments.map(a => [a.no, a.name, a.use, a.license])),
      h("h3", null, "交付檢核"), h("div", null, p.teacher.delivery_check_intro,
        p.teacher.delivery_check.map(x => h("label", { style: "display:block" }, h("input", { type: "checkbox", checked: !!ck[x], onchange: e => { ck[x] = e.target.checked; store("tb:t:delivery", ck); } }), " ", x)))]);
  }
  function pageMis(u) {
    const m = u.misconceptions;
    shell(u, "mis", [h("h1", null, "學習困難速查"), h("p", { class: "small muted" }, m.note), kvTable(m.teacher.basic),
      h("h2", null, "一　困難與引導速查"),
      table(["節次／學習困難", "學生表現", "引導方式", "改善判準"], m.items.map(i => [`第${i.lesson}節\n${i.quick_name}`, i.teacher.quick.performance, i.teacher.quick.guidance, i.teacher.quick.criterion])),
      h("h2", null, "二　單項引導表"), h("p", { class: "small muted" }, m.teacher.guide_note),
      m.items.map(i => h("div", { class: "card" }, h("h3", null, i.name, i.questions ? "　" + i.questions : ""),
        i.hints ? [kvTable([{ label: "學生表現", value: i.teacher.performance }, { label: "學習重點", value: i.teacher.focus }]),
          table(["提示層次", "提問或行動", "對照材料"], ["L1", "L2", "L3"].map(l => [m.levels[l], i.hints[l], i.teacher.materials[l]]))]
          : pendingBox("本項 L1–L3 單項引導表" + PENDING, "10 只提供速查列。"))),
      h("p", { class: "small" }, "設計參考：", m.teacher.refs.map((r, i) => [i ? "、" : "", h("a", { href: r.url, target: "_blank", rel: "noopener" }, r.text)])),
      h("p", { class: "small muted" }, m.teacher.footer)]);
  }

  // ---------- 匯入作答與批改（教師版） ----------
  function allQuestions(u, n) {
    const ws = u.worksheets[n];
    const qs = ws.questions.map(q => ({ ...q, kind: q.teacher && q.teacher.key ? "auto" : "open" }));
    u.plan.lessons.find(x => x.n === n).steps.forEach(s => s.blocks.filter(b => b.type === "core").forEach(b => b.ids.forEach(no => {
      const c = u.core.items.find(x => x.no === no);
      qs.push({ id: "C" + no, label: "核心題 " + no, prompt: c.question, parts: [{ id: "x", type: "text" }], kind: "open", core: c });
    })));
    return qs;
  }
  function autoScore(q, parts) {
    if (!q.teacher || !q.teacher.key || !parts) return null;
    const k = q.teacher.key; const keys = Object.keys(k);
    return { got: keys.filter(x => parts[x] === k[x]).length, of: keys.length };
  }
  function pageGrade(u) {
    let recs = store("tb:t:import") || [];
    const grades = store("tb:t:grades") || {};
    let lesson = 1;
    const area = h("div");
    const dz = h("div", { class: "dropzone" }, "把全班的作答紀錄檔（.json）拖到這裡，或 ", h("label", { class: "link", style: "text-decoration:underline;cursor:pointer;color:var(--accent)" }, "選擇檔案", h("input", { type: "file", multiple: true, accept: ".json,application/json", style: "display:none", onchange: e => readFiles(e.target.files) })));
    dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("over"));
    dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("over"); readFiles(e.dataTransfer.files); });
    const msg = h("div", { class: "small" });
    async function readFiles(files) {
      let added = 0, bad = [];
      for (const f of files) {
        try { let d = JSON.parse(await f.text()); if (!Array.isArray(d)) d = [d];
          d.forEach(r => { if (r.schema !== "tb-record/1" || r.unit !== u.meta.id) throw 0; recs = recs.filter(x => !(x.student_code === r.student_code && x.lesson === r.lesson)); recs.push(r); added++; });
        } catch (e) { bad.push(f.name); }
      }
      store("tb:t:import", recs);
      msg.textContent = `已匯入 ${added} 份紀錄。` + (bad.length ? `無法讀取：${bad.join("、")}` : "");
      draw();
    }
    const gk = (s, n, q) => `${s}|${n}|${q}`;
    function draw() {
      area.innerHTML = "";
      const qs = allQuestions(u, lesson);
      const rs = recs.filter(r => r.lesson === lesson).sort((a, b) => String(a.student_code).localeCompare(String(b.student_code)));
      area.append(h("div", { class: "filters" }, u.meta.lessons.map(l => h("button", { class: lesson === l.n ? "on" : "", onclick: () => { lesson = l.n; draw(); } }, `第${l.n}節（${recs.filter(r => r.lesson === l.n).length}）`))));
      if (!rs.length) { area.append(h("p", { class: "muted" }, "這一節還沒有匯入紀錄。")); return; }
      area.append(table(["學生代碼", ...qs.map(q => q.label), "提示", "轉教師", "更新時間"], rs.map(r => [
        r.student_code,
        ...qs.map(q => { const it = r.items[q.id]; const sc = autoScore(q, it && it.parts); const g = grades[gk(r.student_code, lesson, q.id)];
          return h("button", { class: "link", onclick: () => detail(r, q) }, !it ? "—" : sc ? `${sc.got}/${sc.of}` : g || "待評"); }),
        String(r.hints.length), r.handoff.length ? "是" : "", new Date(r.updated_at).toLocaleString("zh-TW")])));
    }
    function detail(r, q) {
      const it = r.items[q.id] || {};
      const sc = autoScore(q, it.parts);
      const key = gk(r.student_code, lesson, q.id);
      const crit = q.core ? q.core.teacher.rubric : null;
      const bg = h("div", { class: "modal-bg", onclick: e => { if (e.target === bg) bg.remove(); } }, h("div", { class: "modal", style: "max-width:760px;max-height:90vh;overflow:auto" },
        h("h3", null, r.student_code, "　第", lesson, "節　", q.label),
        q.prompt ? h("p", { class: "small" }, q.prompt) : pendingBox("題目文字" + PENDING, q.plan_ref ? "02 教案：" + q.plan_ref : ""),
        it.draft ? [h("b", null, "初稿"), pre(partsSummary(q, it.draft.parts), "draft"), drawings(q, it.draft.parts)] : null,
        h("b", null, it.draft ? "修訂稿／目前作答" : "目前作答"), pre(partsSummary(q, it.parts), "draft"), drawings(q, it.parts),
        it.revision_reason ? [h("b", null, "修訂理由"), pre(it.revision_reason, "draft")] : null,
        sc ? h("p", null, h("b", null, "自動計分："), `${sc.got}/${sc.of}`) : null,
        q.teacher ? teacherBox("參考答案與判讀", q.teacher.answer.map(x => h("p", { class: "small" }, x))) : null,
        crit ? teacherBox("成功規準（05）", rubricView(crit)) : null,
        !sc ? h("div", null, h("b", null, "三級規準評分："), ["達成", "發展中", "待支持"].map(l => h("label", { style: "margin-right:1rem" },
          h("input", { type: "radio", name: "g", checked: grades[key] === l, onchange: () => { grades[key] = l; store("tb:t:grades", grades); draw(); } }), " ", l))) : null,
        r.hints.filter(x => (x.questions || []).includes(q.id)).length ? [h("b", null, "提示使用歷程"), h("ul", { class: "small" }, r.hints.filter(x => (x.questions || []).includes(q.id)).map(x => h("li", null, new Date(x.at).toLocaleTimeString("zh-TW"), " ", x.level || "AI", "：", x.text)))] : null,
        h("div", { class: "toolbar" }, h("button", { onclick: () => bg.remove() }, "關閉"))));
      document.body.append(bg);
    }
    function drawings(q, parts) { return (q.parts || []).filter(p => p.type === "draw" && parts && parts[p.id]).map(p => h("img", { class: "thumb", src: parts[p.id] })); }
    function csv() {
      const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
      const lines = [["學生代碼", "節次", "題號", "題型", "自動計分", "三級規準", "初稿", "修訂稿／目前作答", "修訂理由", "使用提示層次", "轉教師", "更新時間", "教材版本"].map(esc).join(",")];
      recs.forEach(r => allQuestions(u, r.lesson).forEach(q => {
        const it = r.items[q.id]; if (!it) return;
        const sc = autoScore(q, it.parts);
        lines.push([r.student_code, r.lesson, q.label, sc ? "客觀" : "開放", sc ? `${sc.got}/${sc.of}` : "", grades[gk(r.student_code, r.lesson, q.id)] || "",
          it.draft ? partsSummary(q, it.draft.parts) : "", partsSummary(q, it.parts), it.revision_reason || "",
          r.hints.filter(x => (x.questions || []).includes(q.id)).map(x => x.level || "AI").join(" "), r.handoff.some(x => (x.questions || []).includes(q.id)) ? "是" : "", r.updated_at, r.material_version].map(esc).join(","));
      }));
      download(`${u.meta.title}_成績.csv`, "﻿" + lines.join("\r\n"), "text/csv");
    }
    shell(u, "grade", [h("h1", null, "匯入作答與批改"),
      h("p", { class: "small muted" }, "紀錄只存在這台電腦的瀏覽器。客觀題自動計分；開放題依三級規準（達成／發展中／待支持）點選。"),
      dz, msg,
      h("div", { class: "toolbar" }, h("button", { class: "primary", onclick: csv }, "匯出 CSV"),
        confirmBtn("清除匯入資料", "確定清除匯入紀錄與評分（再按一次）", () => { storeDel("tb:t:import"); storeDel("tb:t:grades"); route(); })),
      area]);
    draw();
  }

  // ---------- 列印中心 ----------
  function pagePrintIndex(u) {
    shell(u, "print", [h("h1", null, "列印中心"),
      table(["節次", "學生版", T ? "教師版" : null].filter(Boolean), u.meta.lessons.map(l => [l.title,
        h("a", { href: `#/u/${u.meta.id}/print/${l.n}/student` }, "學習單（學生版）"),
        T ? h("a", { href: `#/u/${u.meta.id}/print/${l.n}/teacher` }, "學習單（教師版）") : null].filter(x => x !== null)))]);
  }
  function pagePrint(u, n, who) {
    const tv = who === "teacher" && T;
    const ws = u.worksheets[n], L = u.plan.lessons.find(x => x.n === n);
    const order = [];
    L.steps.forEach(s => s.blocks.forEach(b => {
      if (b.type === "activity") order.push({ act: ws.activities[b.id] });
      if (b.type === "q") b.ids.forEach(id => order.push({ q: ws.questions.find(q => q.id === id) }));
      if (b.type === "core") b.ids.forEach(no => order.push({ core: u.core.items.find(c => c.no === no) }));
    }));
    const lines = k => h("div", { class: "lines" }, Array.from({ length: k }, () => h("div")));
    const page = h("div", { class: "print-page" },
      h("div", { class: "toolbar noprint" }, h("button", { class: "primary", onclick: () => window.print() }, "列印"), h("a", { href: `#/u/${u.meta.id}/lesson/${n}` }, "回到節次頁")),
      h("h2", { style: "margin-top:0" }, u.meta.title, "　", L.title, "　學習單", tv ? "（教師版）" : ""),
      h("p", null, "學生代碼：＿＿＿＿＿＿　日期：＿＿＿＿＿＿"),
      ws.pending ? pendingBox(`第${n}節學習單完整題目` + PENDING, "03 只示範第2節；本節題號與任務取自 02 教案。") : null,
      order.map(o => {
        if (o.act) return h("div", { class: "pq" }, h("b", null, o.act.title), h("p", null, o.act.context));
        if (o.core) return h("div", { class: "pq" }, h("b", null, "核心題 ", o.core.no), h("p", null, o.core.question), lines(4),
          tv ? h("div", { class: "ans" }, h("b", null, "答案要素："), o.core.teacher.answer.join(" "), h("br"), rubricView(o.core.teacher.rubric)) : null);
        const q = o.q;
        return h("div", { class: "pq" }, h("b", null, q.label, "　"), q.prompt || h("span", null, "題目" + PENDING + (q.plan_ref ? "（02 教案：" + q.plan_ref + "）" : "")),
          (q.parts || [{ type: "text", lines: 4 }]).map(p => p.type === "choice" ? h("div", null, p.group || "", p.label ? p.label + "　" : "", p.options.map(x => "□ " + x + (x === "其他：" ? "＿＿＿＿" : "")).join("　"))
            : p.type === "draw" ? [p.label ? h("div", null, p.label) : null, h("div", { class: "drawbox" })]
            : [p.label ? h("div", null, p.label) : null, lines(p.lines || 3)]),
          tv && q.teacher ? h("div", { class: "ans" }, h("b", null, "參考答案與判讀："), q.teacher.answer.map(x => h("div", null, x)), q.teacher.errors ? [h("b", null, "常見錯誤與引導："), q.teacher.errors.map(x => h("div", null, x))] : null) : null);
      }));
    $app.innerHTML = ""; $app.append(page);
  }

  // ---------- 路由 ----------
  function route() {
    const parts = (location.hash.replace(/^#\/?/, "") || "").split("/").filter(Boolean).map(decodeURIComponent);
    if (!T && !sid()) { shell(null, null, h("p", null, "請先輸入學生代碼。")); askSid(); return; }
    if (parts[0] !== "u") return pageHome();
    const u = unitById(parts[1]); if (!u) return pageHome();
    const p = parts[2];
    if (!p) return pageUnit(u);
    if (p === "lesson") return pageLesson(u, +parts[3]);
    if (p === "test") return pageTest(u, parts[3]);
    if (p === "extension") return pageExtension(u);
    if (p === "assets") return pageAssets(u);
    if (p === "print") return parts[3] ? pagePrint(u, +parts[3], parts[4]) : pagePrintIndex(u);
    if (T && p === "design") return pageDesign(u);
    if (T && p === "blueprint") return pageBlueprint(u);
    if (T && p === "misconceptions") return pageMis(u);
    if (T && p === "grade") return pageGrade(u);
    pageUnit(u);
  }
  TB.units.forEach(u => { u.assets.byId = Object.fromEntries(u.assets.assets.map(a => [a.id, a])); });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body></html>
