formal_note: "本節以原始檔案（01 示範版）原文為正式版本；日後如提供出版社課本，改以課本原文替換。"

overview:
  - {label: "單元名稱", value: "干涉與繞射"}
  - {label: "適用對象", value: "高中一年級必修物理；已學過波的波長、頻率、週期與振幅等物理概念，採定性理解。"}
  - {label: "核心結論", value: "光的干涉與繞射形成有規律的明暗分布，可用波的疊加與惠更斯原理解釋，因此支持光具有波動性。"}
  - {label: "先備知識", value: "知道波會傳播；能區分位移與振幅，理解波長、頻率及週期的意義。"}
  - {label: "內容範圍", value: "處理波的疊加、水波干涉、雙狹縫、單狹縫與薄膜干涉；以定性解釋為主，暫不推導條紋位置及膜厚公式。"}

node_order:
  - {no: "01", name: "波的疊加與水波干涉", core: "波的疊加可造成振幅增強或減弱；位移為零不等於振幅為零。", link: "先備：位移、振幅、週期。"}
  - {no: "02", name: "雙狹縫干涉", core: "兩列相干光波疊加，在屏幕形成穩定的明暗分布。", link: "承接01：將振幅增減連到光的明暗。"}
  - {no: "03", name: "單狹縫繞射", core: "狹縫內不同位置的次波疊加，形成中央寬亮紋與旁側弱亮紋。", link: "承接02：由兩個次波源推進到縫內許多次波源。"}
  - {no: "04", name: "薄膜干涉與單元統整", core: "薄膜反射光的干涉可形成色彩；干涉與繞射共同支持光的波動性。", link: "承接02、03：應用疊加概念並收束全章。"}

nodes:
  "01":
    title: "01　波的疊加與水波干涉"
    understanding: "在理想線性介質中，合位移等於各波位移之和；固定位置的振幅取決於兩列波的振動關係。"
    body:
      - "兩列繩波脈衝相遇時，會暫時在同一段繩上重疊。在理想線性介質中，該處的合位移等於兩列波各自造成的位移相加。相遇結束後，兩列脈衝仍各自沿原方向傳播。"
      - "對同一位置的兩列同頻率週期波而言，若振動步調相同，合振幅最大，稱為完全建設性干涉；若振幅相等且振動步調恰好相反，合振幅為零，稱為完全破壞性干涉。"
      - "位移是某一時刻偏離平衡位置的程度；振幅則是週期振動中偏離平衡位置的最大程度。某一刻位移為零，不能據此認定振幅為零。"
      - "兩個位置固定、振動關係固定的水波源，可形成位置穩定的干涉分布。完全相消還要求兩列波到達該處時振幅相等。局部振幅為零，不代表兩列波永久消失。"
    conditions: "疊加採理想線性近似。穩定干涉須有固定的波源相位關係；完全相消須在觀察處等振幅、反相。應寫「位移相消」，避免把它說成總能量消失。"
    teacher:
      curriculum_note: "（可扣課綱代碼）"
      check_label: "參考書目"
      check: ["查核重點：線性疊加、波通過彼此、完全相消的條件。", "OpenStax University Physics Vol. 1 §16.5（2026-09-04查核）"]
      self_check_label: "自我檢核"
      self_check: ["■ 名詞與定義一致　■ 因果或關係正確", "■ 適用條件完整　　■ 前後概念連貫", "■ 關鍵說法有依據"]
  "02":
    title: "02　雙狹縫干涉"
    understanding: "兩列相干光波到達屏幕各處時的相位差不同，形成穩定的明暗條紋。"
    body:
      - "單色光照射兩條相近的窄縫後，屏幕可出現交替排列的明暗條紋。這些條紋是光在不同位置的強度分布，不能當成兩條狹縫的放大影像。"
      - "依惠更斯原理，波面上各點可視為發出次波的波源；在窄縫近似下，兩條狹縫可視為兩個次波源。同一穩定單色光適當照明兩縫時，兩者頻率相同，並保持固定的相位關係，稱為相干波源。相位描述週期振動進行到哪個階段。"
      - "兩列光波到達某處時，若相位相同便互相增強；若相位相反便互相減弱。兩列光波在該處振幅相等且反相時，可完全相消。眼睛無法追蹤光的快速振動，看到的是時間平均的光強度，因此形成亮紋與暗紋。"
      - "暗紋不表示兩列光波都未到達。光波疊加可以解釋這種規律分布，提供光具有波動性的證據。"
    conditions: "此處採同偏振方向、相干單色光的理想模型。完全暗紋還需等振幅；實驗暗紋可能仍有背景光。兩縫都會產生繞射，不能說雙狹縫只有干涉。"
    teacher:
      check_label: "查核依據"
      check: ["查核重點：相干條件、次波源近似與明暗紋的形成。", "OpenStax University Physics Vol. 3 §3.1（2026-09-04查核）"]
      self_check_label: "精確性檢核"
      self_check: ["■ 名詞與定義一致　■ 因果或關係正確", "■ 適用條件完整　　■ 前後概念連貫", "■ 關鍵說法有依據"]
  "03":
    title: "03　單狹縫繞射"
    understanding: "光通過窄縫後，縫內不同位置的次波在各方向增強或減弱，形成繞射的明暗分布。"
    body:
      - "單色光通過窄單狹縫後，會向側方展開。在遠場條件下，屏幕中央出現較寬、較亮的中央亮紋，兩側則有較窄、逐漸變弱的旁側亮紋，亮紋之間由暗紋隔開。此處的遠場指屏幕足夠遠，使縫內各處到同一觀察點的傳播方向可近似平行。"
      - "以均勻、同相照明的狹縫為例，縫內不同位置可視為許多次波源。正前方的次波大致同相到達，彼此增強；偏離正前方後，各次波的路徑長度不同，某些方向完全相消，另一些方向仍有部分增強。"
      - "在相同波長與遠場觀察條件下，於本教材的狹縫尺度內縮小縫寬，會使繞射展開角度增加，中央亮紋變寬。這不是狹縫影像的單純放大。"
      - "雙狹縫以兩縫之間的光波疊加說明條紋；單狹縫則考慮同一縫內不同位置的次波疊加。兩者都運用波的疊加概念。"
    conditions: "中央寬亮紋與旁側亮紋的敘述採遠場、均勻單色照明條件。「縫越窄，展開越明顯」須固定波長並限於本教材尺度，不能外推到所有縫寬與近場情況。"
    teacher:
      check_label: "查核依據"
      check: ["查核重點：遠場假設、次波疊加、中央亮紋與縫寬關係。", "OpenStax University Physics Vol. 3 §4.1（2026-09-04查核）"]
      self_check_label: "精確性檢核"
      self_check: ["■ 名詞與定義一致　■ 因果或關係正確", "■ 適用條件完整　　■ 前後概念連貫", "■ 關鍵說法有依據"]
  "04":
    title: "04　薄膜干涉與單元統整"
    understanding: "透明薄膜兩表面的反射光可發生干涉；薄膜色彩與狹縫明暗分布均可用光的波動模型解釋。"
    body:
      - "白光照到肥皂膜或水面油膜時，部分光在上表面反射，另一部分進入薄膜，在下表面反射後再離開。兩部分光朝同一觀察方向傳播時，可以互相干涉。"
      - "干涉結果與膜厚、折射率、觀察角度及光的波長有關，也受到反射時振動相位改變的影響。相位描述振動進行到哪個階段；折射率則反映光在介質中的傳播速度。膜厚隨位置變化時，白光中的不同波長可能在不同位置增強或減弱，因而呈現彩色分布。"
      - "牛頓環與薄空氣膜的干涉有關；抗反射鍍膜利用干涉，在設計的波長與角度範圍內降低反射。這些例子都能連回光波疊加的概念。"
      - "回顧雙狹縫與單狹縫，雖然參與疊加的次波源分布不同，兩者都形成有規律的明暗分布。這些現象可由波動模型解釋，因此支持光具有波動性。"
    conditions: "以透明薄膜的反射光作定性說明；不能只比較幾何路徑而忽略反射相位。「抗反射」有波長與角度範圍，不表示所有光都不反射。波動性證據也不等於否定光的粒子性。"
    teacher:
      check_label: "查核依據"
      check: ["查核重點：兩表面反射、反射相位及膜厚對干涉的影響。", "OpenStax University Physics Vol. 3 §3.4（2026-09-04查核）"]
      self_check_label: "精確性檢核"
      self_check: ["■ 名詞與定義一致　■ 因果或關係正確", "■ 適用條件完整　　■ 前後概念連貫", "■ 關鍵說法有依據"]

curriculum:
  source: "國家教育研究院《十二年國民基本教育課程綱要 國民中小學暨普通型高級中等學校—自然科學領域》（中華民國一○七年十一月），國中「波動、光及聲音（Ka）」學習內容，原文照錄。"
  items:
    - "Ka-Ⅳ-1　波的特徵，例如：波峰、波谷、波長、頻率、波速、振幅。"
    - "Ka-Ⅳ-2　波傳播的類型，例如：橫波和縱波。"
    - "Ka-Ⅳ-6　由針孔成像、影子實驗驗證與說明光的直進性。"
    - "Ka-Ⅳ-7　光速的大小和影響光速的因素。"
    - "Ka-Ⅳ-8　透過實驗探討光的反射與折射規律。"
    - "Ka-Ⅳ-9　生活中有許多運用光學原理的實例或儀器，例如：透鏡、面鏡、眼睛、眼鏡及顯微鏡等。"
    - "Ka-Ⅳ-10　陽光經過三稜鏡可以分散成各種色光。"
    - "Ka-Ⅳ-11　物體的顏色是光選擇性反射的結果。"
  teacher:
    reminder: "提醒：以上條目文字經線上擷取，正式上線前請對照課綱 PDF 第 Ka 主題表格核對一次。"
