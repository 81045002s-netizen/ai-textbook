# 來源：02_已填寫參考範例/07B_多模態輔助教材需求腳本_波的疊加示範版.docx（原文照錄；表單灰字提示不錄）
# 全部為教師版（製作用）。img/ 內圖片取自同一 docx。
teacher:
  scripts:
    - title: "同向與反向脈衝完全重疊比較圖"
      intro: "每張圖片填一份；可用文字、手繪或貼圖表達；大型草圖填於下一頁。本例為製作需求，尺寸與數值為示範設定。"
      fields:
        - {label: "基本資料", lines: ["同向與反向脈衝完全重疊比較圖。", "適用：高中一年級必修物理；編寫者：＿＿＿＿。"]}
        - {label: "知識節點與使用目的", lines: ["節點：同一位置位移的代數和。第1節學習單Q2–Q3，觀察後比較完全重疊的兩種結果。"]}
        - {label: "畫面構圖與必要元素", lines: ["左右並列「同向位移」與「反向位移」，均呈現等大、同形脈衝完全重疊的瞬間；反向案例上下對稱。", "每欄上圖為分波A、B，下圖為當下合成繩形；共用相同座標尺度與P點位置。", "同向案例中央為＋1＋1＝＋2；反向為＋1－1＝0。數值採相對單位。"]}
        - {label: "文字與符號標示", lines: ["標題：「兩種完全重疊的比較」。橫軸為位置，縱軸為位移，均標平衡位置。", "A用細實線、B用虛線，合成繩形用粗實線；加文字標籤區別。", "下圖標「完全重疊當下」，圖下注「理想線性介質中的模型示意」。"]}
        - {label: "多模態呈現容易誤解處", lines: ["三條曲線可能被當成三條繩子：將分波輔助線與合成繩形分區，註明分波是模型表示。", "零位移可能被當成波消失：補註「只在完全重疊當下相消，之後兩脈衝仍各自傳播」。", "兩欄使用相同尺度，避免把繪圖大小當成不同物理條件。"]}
        - {label: "輸出需求", lines: ["重繪為白底黑線、橫式2∶1；交付2400×1200 PNG。", "隨圖提供一句文字說明，交代同向增強、等大反向相消與適用條件。"]}
      reminder: "使用提醒：涉及實拍、模型或示意時，請在畫面中明確標示。"
      image: {src: "07B_image1.png", caption: "對應圖片：同向與反向脈衝完全重疊比較圖。以下為構圖示範。", note: "補充標註：上下分區避免把分波與合成繩形誤認成三條繩子；兩欄共用相同刻度。"}
    - title: "波的疊加動畫影片需求腳本示範"
      intro: "每個鏡頭填一列，可增刪。本例規劃36秒動畫；旁白同時作字幕，無配樂。"
      fields:
        - {label: "基本資料", lines: ["兩個脈衝相遇的兩種案例；高中物理。"]}
        - {label: "知識節點與使用目的", lines: ["知識節點：疊加與通過後狀態。配合第1節學習單Q1–Q3，讓學生說明脈衝相遇前後的變化。"]}
      shots_note: "分鏡內容　草圖上區為分波模型，下區為合成繩形；A細實線、B虛線，箭頭表示傳播方向。"
      shots_header: ["編號\n時間", "畫面內容或草圖", "旁白與字幕", "動作與轉場", "備註與素材"]
      shots:
        - {no: "01\n0–6秒", scene: "A、B兩個向上脈衝分置左右。分波在上、合成繩形在下，標平衡位置。", img: "07B_image2.png", narration: "「在理想線性介質中，兩個相同脈衝正相向傳播。」", action: "先定格標示，再同步向中央移動。箭頭僅表示傳播方向。", note: "單峰脈衝；統一座標尺度。"}
        - {no: "02\n6–14秒", scene: "呈現完全重疊；P點顯示＋1、＋1，合成＋2。", img: "07B_image3.png", narration: "「同一位置的位移相加。同向重疊時，這裡的合成位移變大。」", action: "抵達中央後定格2秒；配合旁白依序顯示三個數值。", note: "相對單位；字幕與數值同步。"}
        - {no: "03\n14–20秒", scene: "恢復移動，A到右側、B到左側，維持原形狀與方向。", img: "07B_image4.png", narration: "「通過之後，兩個脈衝仍各自向原方向傳播。」", action: "不中斷追蹤A、B標籤；固定視角。", note: "保留標籤，不交換分波身分。"}
        - {no: "04\n20–28秒", scene: "切換到一上一下的等大脈衝；完全重疊時合成繩形為平線。", img: "07B_image5.png", narration: "「改成等大反向時，位移抵銷，完全重疊當下合成位移為零。」", action: "標明「新案例」後重新播放；中央定格2秒。", note: "同寬、同速；P點顯示＋1－1＝0。"}
        - {no: "05\n28–36秒", scene: "接續通過後畫面；平線重新分成向上與向下的兩個脈衝。", img: "07B_image6.png", narration: "「零位移只描述這一瞬間；不代表波或能量永久消失。」", action: "A、B沿原方向離開；最後停留總結文字2秒。", note: "尾字：「重疊暫時，通過後各自傳播」。"}
      misread: ["相消後立即切走容易被誤認成永久消失，須連續播到兩脈衝通過後。分波為輔助表示，合成繩形另區顯示。", "「新案例」先標明再切換；停格註明為教學定格，避免被理解成波真的停止。"]
      output: "輸出需求：MP4／1920×1080／16∶9／36秒，另附字幕文字檔；依據第1節學習單Q1–Q3，時長為示範設定。"
    - title: "波的疊加模擬需求腳本示範"
      intro: "每個模擬填一份；操作表每列一項功能。本例為改作需求，新增設定尚未實作。"
      fields:
        - {label: "基本資料", lines: ["可調脈衝高度的疊加模擬。", "適用：高中物理；編寫者：＿＿＿＿。"]}
        - {label: "知識節點與使用目的", lines: ["節點：位移代數和、通過後狀態。", "配合第1節學習單Q1–Q3，先預測，再調整脈衝高度比較結果。"]}
        - {label: "初始畫面與參數", lines: ["上區顯示分波A、B，下區顯示合成繩形；標平衡位置及中央觀察點P。初始靜止待播放。", "A、B的帶符號脈衝高度：初值均＋1，範圍－1.5～＋1.5、步進0.1，採相對單位。", "兩個單峰脈衝同形、等寬，中心在畫面25%、75%；寬度與波速固定。"]}
        - {label: "變化規則", lines: ["同一位置、同一時刻的合成位移＝A的位移＋B的位移。A、B以等速相向傳播，通過後各自保持原形狀與方向。", "採理想線性介質，忽略反射及衰減；視窗外不反彈回來。"]}
      params_header: ["參數名稱", "設定權限", "預設值與單位", "範圍與步進", "作用與限制"]
      params:
        - ["脈衝高度 A", "學生可調", "＋1\n相對單位", "−1.5～＋1.5\n步進 0.1", "含正負號；調整後回到起始畫面。"]
        - ["脈衝高度 B", "學生可調", "＋1\n相對單位", "−1.5～＋1.5\n步進 0.1", "含正負號；調整後回到起始畫面。"]
        - ["波形與寬度", "程式固定", "同形單峰\n全寬為畫面20%", "固定值", "兩波等寬；不提供學生控制項。"]
        - ["波速", "程式固定", "每秒5%\n畫面寬度", "固定值", "A向右、B向左等速；不提供學生控制項。"]
        - ["起始位置", "程式固定", "A：25%\nB：75%\n畫面位置", "固定值", "重設或切換案例時恢復起始位置。"]
        - ["座標與觀察點", "程式固定", "位移：−3～＋3\n相對單位\nP：畫面50%", "固定值", "固定刻度，避免曲線自動縮放造成誤判。"]
      params_note: "本例新增的全寬20%、波速每秒5%與位移刻度為需求示範設定，尚未實作。"
      ops_header: ["操作項目", "操作與條件", "畫面結果與回饋"]
      ops:
        - ["調整脈衝高度", "A、B各一個滑桿；調整後回到起始畫面。", "曲線同步改變；顯示帶正負號的高度數值。"]
        - ["播放與暫停", "播放後A向右、B向左等速傳播；暫停時固定時間。", "P點即時列出兩分位移與合成值；通過後方向不變。"]
        - ["切換案例", "同向：＋1、＋1；反向：＋1、－1。\n切換時重置位置。", "完全重疊時P點分別為＋2或0。"]
        - ["重設", "恢復A、B高度＋1，起始位置25%、75%，時間歸零。", "回到未播放狀態；保留模型說明與操作按鈕。"]
      misread: ["負值表示脈衝向下，不稱為「負振幅」；控制項命名為「脈衝高度（含正負號）」。", "分波線不是三條實體繩子，須與合成繩形分區；位移為零時仍接續呈現通過後狀態。"]
      output: "交付離線HTML，支援電腦與平板；附操作文字及相遇前、重疊、通過後三張靜態圖。"
      image: {src: "07B_image7.png", caption: "介面草圖示範：同向案例在完全重疊當下暫停；編號對應畫面區域。", note: "圖中①②為波形顯示，③為學生操作，④⑤為唯讀資訊；此圖為介面草圖。"}
