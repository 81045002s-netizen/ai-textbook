# 來源：02_已填寫參考範例/05_核心教學題目_干涉與繞射示範版.docx（原文照錄；表單灰字提示不錄）
# 學生可見：節次與階段、學習目標、核心問題。teacher: 底下只輸出到教師版。
source: "題目來源：同資料夾「干涉與繞射 核心教學題目 原始完整版備份」。七題沿用原識別碼。"
unit_info:
  - {label: "領域與科目", value: "自然科學領域／高中物理；單元：干涉與繞射。"}
  - {label: "年級與節數", value: "高中學習階段；共3節課。"}
  - {label: "主要學習目標", value: "能以波的疊加解釋光的雙狹縫干涉與單狹縫繞射，並定性說明光支持波動性；能區分真實證據與模型，說明波動描述的適用範圍。"}
  - {label: "內容範圍與邊界", value: "處理七個可評量知識節點，以觀察、比較與定性解釋為主；不要求條紋間距、膜厚公式推導、參數掃描或光的全部性質。"}
  - {label: "預計題數", value: "共7題：第1節2題、第2節2題、第3節3題。"}
items:
  - no: 1
    lesson: 1
    stage: "第1節\n預測與解釋"
    goal: "能以同一位置、同一時刻的位移代數和判斷合成結果，並說明兩波通過後的狀態。"
    question: "兩列波在同一位置相遇時，合成位移如何決定？兩列波通過彼此後又會發生什麼？"
    teacher:
      function: "概念建構與迷思診斷"
      concepts: "波的疊加原理、質點位移、合成波、建設性／破壞性疊加"
      evidence: ["相遇前、完全重疊、通過後三個代表時刻；同向與等大反向兩組繩波畫面；學生的合成波預測圖與修訂圖。", "保存：學習單的預測、修訂與文字解釋；標明觀察或模型來源。"]
      answer: ["須以同一位置、同一時刻的分波位移作代數相加；同向位移使合成位移增大，反向位移使合成位移減小，等大反向時瞬時合成位移可為零。重疊只發生於相遇期間，在理想線性介質中，兩列波通過後仍各自依原方向傳播。"]
      misconceptions: "把波相遇視為物體碰撞而反彈、黏住或消失；把瞬時合成位移為零說成兩列波或總能量永久消失；只寫「相加」卻未指明同一位置與同一時刻。"
      rubric:
        達成: "能畫出或敘述兩組代表案例的合成結果，明確使用位移代數和，並說明通過後各自傳播。"
        發展中: "能判斷增強或減弱，但缺少位置、時刻條件，或未交代通過後狀態。"
        待支持: "將兩波說成互撞反彈、永久合併或消失，或把相消解釋為能量不存在。"
  - no: 2
    lesson: 1
    stage: "第1節\n觀察與解釋"
    goal: "能依一段時間的起伏紀錄辨認腹線與節線，並解釋其位置穩定的原因。"
    question: "兩個同相點波源為什麼會形成位置穩定的腹線與節線，而不是隨機斑塊或另一組向外傳播的波？"
    teacher:
      function: "現象解釋與證據判讀"
      concepts: "同調波源、雙點波源干涉、腹線、節線、振幅與瞬時位移"
      evidence: ["同一位置在一個週期內的起伏紀錄、3D水面與俯視圖的對照、振幅最大與接近不動位置的選點紀錄。不得只用單一時刻的顏色或光影判斷。", "保存：選點、起伏紀錄及文字解釋，並註明實驗或模型。"]
      answer: ["兩波源同頻率且相位關係固定，使固定位置的到達相位差保持穩定。同相到達時振幅增大；反相到達時振幅減小，觀察處等振幅時才完全相消。", "振幅極大或極小的位置連成腹線、節線；這些線不是向外移動的波前。判讀須看一段時間的起伏。"]
      misconceptions: "只把波峰交點當成建設性干涉；以亮色等同腹線、暗色等同節線；認為節線必定在真實水槽中完全靜止；把腹線或節線畫成向外傳播的圓形波。"
      rubric:
        達成: "能從一段時間的振幅紀錄指出腹線與節線，並用固定到達關係、位移疊加與線狀分布完成因果鏈。"
        發展中: "能辨認腹線、節線或建設性、破壞性干涉，但未說明為何位置穩定或未區分振幅與瞬時位移。"
        待支持: "只依顏色、單張截圖或波峰交點判斷，或把干涉線當成波前。"
  - no: 3
    lesson: 2
    stage: "第2節\n預測與觀察"
    goal: "能比較直進模型的預測與真實屏幕特徵，提出修正模型的理由。"
    question: "如果光只沿直線前進，雙狹縫後的屏幕應出現什麼？實際觀察到的多條規律亮暗紋，如何迫使我們修正原來的模型？"
    teacher:
      function: "認知衝突與模型診斷"
      concepts: "雙狹縫屏幕圖樣、證據來源、模型比較、光的波動性"
      evidence: ["教師現場雷射示範、可信實拍或影片中的完整屏幕亮度分布；至少指出中央、左右排列或明暗交替等可回查特徵。波前弧線與理想亮度圖只能作模型，不作主要實驗證據。", "保存：第2節學習單Q1–Q3，保留資料來源、原預測與比較理由。"]
      answer: ["在本活動的近似平行入射及單純幾何直進模型下，預期為兩條狹縫的投影；它無法說明實際屏幕多條明暗交替的分布。", "指出可回查的觀察與預測之差異，再引入能描述光波展開、重疊、增強與減弱的模型。"]
      misconceptions: "把兩條狹縫本身畫成屏幕圖樣；以理想模擬取代真實觀察；只寫「因為光是波」而未指出直進模型失效的具體證據。"
      rubric:
        達成: "能分別表達原模型的預測與實際屏幕特徵，指出兩者矛盾，並說明為何需引入波動模型。"
        發展中: "知道屏幕有多條亮暗紋，但沒有清楚比較原預測，或未標示證據來源。"
        待支持: "仍以兩條狹縫影像解釋整個圖樣，或把模擬波前當成肉眼直接看到的證據。"
  - no: 4
    lesson: 2
    stage: "第2節\n解釋"
    goal: "能連結相干次波源、相位關係與光波疊加，說明亮紋及暗紋。"
    question: "兩道狹縫為什麼可以視為兩個相干次波源？兩列光波如何在屏幕上形成亮紋與暗紋？"
    teacher:
      function: "機制解釋與證據論證"
      concepts: "惠更斯原理、相干次波源、建設性／破壞性干涉、時間平均光強度"
      evidence: ["真實屏幕中的亮暗分布作為現象證據；惠更斯波前、兩狹縫次波源與B亮／D暗位置模型作為機制說明。", "保存：第2節學習單Q4、Q6；分別標示現象證據與解釋模型。"]
      answer: ["在惠更斯觀點下，窄縫可近似為次波源；同一束相干單色光照明，使兩狹縫的出射波同頻率且相位差固定。", "在同偏振的討論下，同相到達使時間平均光強較大；反相到達使光強減小，觀察處等振幅時理想光強為零。暗紋不是沒有光波到達。"]
      misconceptions: "把暗紋說成沒有光到達；把水波模擬當成光的實驗證據；把波前圓弧當作可見光路；混淆瞬時振動與屏幕時間平均光強度。"
      rubric:
        達成: "能完整連結惠更斯原理、兩個相干次波源、相位關係、干涉結果與屏幕亮度，並區分真實證據與模型。"
        發展中: "能寫出同相亮、反相暗，但未說明次波源由來、光強度或證據地位。"
        待支持: "把亮暗解釋成狹縫影像、遮擋或有無光到達，或把模型圖當作實拍。"
      check: "條件核對：OpenStax University Physics 3 §3.1"
  - no: 5
    lesson: 3
    stage: "第3節\n觀察與解釋"
    goal: "能比較兩種代表性圖樣與次波源分布，並指出共同的疊加原理。"
    question: "雙狹縫干涉與單狹縫繞射的屏幕圖樣不同，為什麼仍可以用同一個次波疊加原理解釋？"
    teacher:
      function: "跨現象比較與概念遷移"
      concepts: "單狹縫繞射、雙狹縫干涉、離散／連續次波源分布、圖樣比較"
      evidence: ["比較教材的遠場代表性實拍：描述單狹縫中央亮紋相對其旁側亮紋的寬度與強弱，以及雙狹縫中央附近的明暗排列；次波源示意用於機制解釋。", "保存：兩種真實圖樣的文字比較及次波源解釋，註明素材來源。"]
      answer: ["兩者皆可由次波疊加說明。窄雙縫近似為兩個分立次波源；單縫內有連續分布的次波源，因此可形成不同的明暗分布。", "均勻照明的單縫遠場圖樣中，中央亮紋比自身旁側亮紋寬且亮，旁側峰值向外減弱；雙縫中央附近明暗交替。不直接斷言不同裝置的中央寬度大小。"]
      misconceptions: "把單狹縫圖樣當成狹縫的放大影像；認為繞射與干涉是兩套毫無關聯的原理；只說光彎曲而未交代次波源分布與疊加。"
      rubric:
        達成: "能同時描述主要圖樣差異、次波源分布差異與共同的疊加機制。"
        發展中: "能描述圖樣或次波源其中一項，但未建立兩者的因果連結。"
        待支持: "仍使用幾何投影解釋，或把干涉與繞射視為完全不同機制。"
      check: "條件核對：OpenStax University Physics 3 §4.1"
  - no: 6
    lesson: 3
    stage: "第3節\n生活應用"
    goal: "能指出薄膜上、下界面的兩路反射光，以干涉定性解釋色彩。"
    question: "透明薄膜沒有彩色顏料，為什麼仍會出現彩色區帶？到達眼睛的是哪兩路光？"
    teacher:
      function: "生活情境遷移"
      concepts: "薄膜干涉、上／下界面反射光、反射光疊加、生活遷移"
      evidence: ["肥皂膜、肥皂泡或油膜的真實彩色現象；薄膜剖面中上表面直接反射光，以及進入薄膜後由下表面反射返回的光。", "保存：薄膜觀察來源與兩路反射光的文字說明。"]
      answer: ["白光照膜後，一路由上表面直接反射；另一路進入薄膜，由下表面反射後穿出上表面。兩路光在觀察方向重疊干涉，使不同波長受到不同程度的增強或減弱。", "教師掌握：相位差涉及光程及反射相位變化。本題只評量兩路反射光與定性干涉，不要求膜厚或顏色計算。"]
      misconceptions: "把顏色歸因於顏料或只歸因於折射；只記得『薄膜干涉』名詞，卻無法指出兩路反射光；要求超出本單元範圍的膜厚公式或特定顏色計算。"
      rubric:
        達成: "能指出兩路反射光，說明它們重疊干涉並造成不同波長增強或減弱；不把顏色歸因於色素。"
        發展中: "能判斷為干涉，但未完整指出兩路反射光或只寫名詞。"
        待支持: "只以顏料或折射解釋，或無法辨認上、下界面的反射路徑。"
      check: "條件核對：OpenStax University Physics 3 §3.4"
  - no: 7
    lesson: 3
    stage: "第3節\n統整評量"
    goal: "能引用兩項真實光學觀察支持波動描述，並說明此結論的界限。"
    question: "雙狹縫干涉與單狹縫繞射如何共同支持光具有波動行為？這項結論的適用範圍是什麼？"
    teacher:
      function: "跨現象統整與科學論證"
      concepts: "模型判別、證據地位、光的波動性、模型適用範圍"
      evidence: ["雙狹縫後多條明暗交替的實拍；單狹縫遠場中央亮紋較自身旁側亮紋寬、旁側較弱的實拍。兩項均須有可回查來源。", "保存：統整短文，列出兩項觀察來源、推論與適用範圍。"]
      answer: ["兩項觀察都需要能展開、疊加並在不同位置增強或減弱的波動描述。單純直進模型既未預測完整圖樣，也無法同時解釋亮暗交替與幾何陰影區中的展開。兩項證據共同支持光在這些情境中具有波動行為；這不等於單靠本單元已完整說明光的全部性質。"]
      misconceptions: "只寫『因為光是波』而沒有證據與比較；把水波或模擬當成支持光的主要實證；過度宣稱波動模型已解釋光的一切，或提前延伸到本單元未處理的內容。"
      rubric:
        達成: "能列出兩項真實光學證據、比較直進與波動模型的解釋力，並清楚寫出論證界限。"
        發展中: "能指出干涉或繞射其中一項支持波動性，但證據不完整、缺少模型比較或界限。"
        待支持: "只重述結論、使用模擬作主要證據，或作出超出本單元證據範圍的宣稱。"
