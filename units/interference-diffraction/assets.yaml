# kind：架構報告規定的「實拍／模型／示意」標籤（依 07A 類型欄歸類）。
# commons：Wikimedia Commons 檔名（取自 07A 來源頁網址），網站以 Special:FilePath 連結原圖；無法連線時顯示佔位卡。
# 本教材自製的圖片與模擬檔不在專案資料夾，status: missing → 佔位。
# teacher: 底下（用途、使用需求）只輸出到教師版。
basic: "高中物理／干涉與繞射／第1–3節；素材資料依原清單（2026-09-02）整理。"
intro: "依原清單精簡欄位，保留既有素材編號、檔案位置、教學用途與來源；本表不含需求腳本及公版。"
groups:
  - {id: sim, title: "互動模擬", note: "共通需求：可嵌入平台或另頁開啟；完全離線需先處理外部套件。原HTML未含AI回饋與操作紀錄；可用關鍵畫面作備援。"}
  - {id: g1, title: "圖片素材 封面與第1節", note: "檔案位置以「圖片與照片/」為起點。封面用於開場；繩波與水波圖為模型、示意或題圖，與真實觀察區分。"}
  - {id: g2, title: "圖片素材 第2節", note: "檔案位置以「圖片與照片/第2節/」為起點。先呈現雙狹縫實拍，再用波前、次波源與亮暗模型解釋。"}
  - {id: g3a, title: "圖片素材 第3節 上", note: "檔案位置以「圖片與照片/第3節/」為起點。單狹縫實拍與理想圖分列；光碟歸入週期結構繞射，油膜與肥皂膜歸入薄膜干涉。"}
  - {id: g3b, title: "圖片素材 第3節 下", note: "檔案位置以「圖片與照片/第3節/」為起點。結構色可能涉及干涉、繞射與散射；延伸照片依個別機制說明。"}
  - {id: s07b, struct_title: "07B 需求腳本規劃素材", note: "每張圖片填一份；可用文字、手繪或貼圖表達；大型草圖填於下一頁。本例為製作需求，尺寸與數值為示範設定。"}

