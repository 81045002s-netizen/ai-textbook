# 來源：02_已填寫參考範例/03_紙本學習單開發表_雙狹縫干涉示範版.docx（原文照錄）
# 03 原檔標「第3節」為誤植，已確認雙狹縫屬第2節（2026-11-27）。
# teacher: 底下＝03 的「教師專用」欄，只輸出到教師版。
lesson: 2
source: "教材來源：第2節「光的雙狹縫干涉」紙本學習單修訂版。保留原Q1–Q6，作答格式與時間為本示範的安排。"
teacher:
  overview:
    - {label: "對應知識節點", lines: ["核心教材示範版節點02「雙狹縫干涉」。", "先備：節點01「波的疊加與水波干涉」，能區分位移、振幅及建設性／破壞性干涉。"]}
    - {label: "學習目標與產出", lines: ["從Q2的觀察紀錄，看學生能否描述屏幕明暗分布並辨識資料來源。", "從Q3的比較，看學生能否依觀察保留或修正預測。", "從Q4、Q6的解釋，看學生能否以光波疊加說明亮暗紋；從Q5看其是否能區分水波與光的可觀察量。"]}
  sequence:
    - {no: "01", name: "先預測", task: "Q1：畫出屏幕預測並保留理由。", time: "8分鐘"}
    - {no: "02", name: "觀察與比較", task: "Q2–Q3：記錄來源、觀察特徵，與預測比較。", time: "12分鐘"}
    - {no: "03", name: "解釋亮暗", task: "Q4：用兩個相干次波源解釋亮紋與暗紋。", time: "15分鐘"}
    - {no: "04", name: "比較與統整", task: "Q5–Q6：比較水波與光，再寫完整解釋。", time: "15分鐘"}

activities:
  act01:
    title: "活動01　先預測（8分鐘）"
    context: "一束穩定紅色雷射光通過相近的雙狹縫，遠方屏幕會出現什麼分布？本節先作定性預測。"
    materials: "使用紙本與筆；先保留自己的預測與理由，再進行實際觀察。學生尚未完成Q1時，先不展示屏幕結果或開啟模擬。"
  act02:
    title: "活動02　觀察與比較（12分鐘）"
    context: "先記錄屏幕實際亮暗分布，再與Q1的預測比較。"
    materials: "教師示範，或提供可回查來源的雙狹縫實拍照片／影片；無設備時使用列印照片。模擬只協助辨認規律。雷射由教師操作，不直視、不指向他人或鏡面。"
  act03:
    title: "活動03　解釋亮暗（15分鐘）"
    context: "B代表亮紋位置，D代表暗紋位置。以同偏振、相干且在觀察處等振幅的兩列光波作理想化討論。"
    materials: "使用原教材雙狹縫波面模型或離線模擬。先說明窄縫可視為次波源；「相干」指同頻率且相位關係固定，「相位」描述振動進行的階段。模型用來解釋Q2的觀察。"
  act04:
    title: "活動04　比較與統整（15分鐘）"
    context: "連結前一節水波干涉經驗，整理光的雙狹縫干涉，說清楚兩種現象的共同規則與差異。"
    materials: "回看第1節水波紀錄，以及本節Q2的觀察與Q4的解釋。使用既有紀錄作答；區分真實觀察與模型，不新增公式。"

questions:
  - id: R1
    label: "修訂第1節Q7"
    revise_of: {lesson: 1, q: Q7}
    plan_ref: "檢查證據與推理，修訂第1節Q7。"
  - id: Q1
    label: "Q1"
    activity: act01
    prompt: "你預測屏幕上會看到什麼？先勾選，再畫出中央與左右兩側的明暗分布，並寫出一項理由。深色代表暗，留白代表亮。"
    lock: true
    parts:
      - {id: c, type: choice, options: ["主要只有兩條亮紋", "整片亮度差不多", "多條明暗相間的條紋", "其他："]}
      - {id: d, type: draw, label: "我的屏幕圖樣預測（請在下方作圖）："}
      - {id: r, type: text, label: "我這樣預測，因為：", lines: 1}
    teacher:
      answer: ["Q1不以預測正誤評分。完成要素為：畫出面向屏幕的完整分布，並保留至少一項可理解的理由。即使預測兩條亮紋，只要理由清楚，也可進入觀察活動。"]
      errors: ["若只畫兩條狹縫，追問：「這是開口的樣子，還是屏幕上看到的樣子？」", "若先擦掉預測，提醒：「請保留初稿，等觀察後再比較。」"]
  - id: Q2
    label: "Q2"
    activity: act02
    prompt: "勾選資料來源，畫出中央與左右兩側的明暗分布，並寫出兩個觀察特徵。"
    parts:
      - {id: c, type: choice, options: ["現場示範", "有來源的實拍照片／影片", "僅理想模型"]}
      - {id: d, type: draw, label: "我的觀察（請在下方作圖）："}
      - {id: f1, type: text, label: "特徵一：", lines: 1}
      - {id: f2, type: text, label: "特徵二：", lines: 1}
    teacher:
      answer: ["Q2：依所用資料描述兩項特徵，例如明暗交替、左右近似對稱；中央附近亮紋間距近似相等。僅觀看模型時，應標為模型結果。"]
      errors: ["若以波面弧線當屏幕實拍，追問：「這個畫面是實際紀錄，還是用來解釋的模型？」"]
  - id: Q3
    label: "Q3"
    activity: act02
    prompt: "與Q1比較後，你保留或修正哪一點？請引用一項觀察。"
    parts:
      - {id: c, type: choice, options: ["大致相同", "部分相同", "不同"]}
      - {id: k, type: text, label: "我保留／修正", lines: 1}
      - {id: e, type: text, label: "依據是", lines: 1}
    teacher:
      answer: ["Q3：指出保留或修改的內容，且能連到觀察；不要求每人一定改變想法。"]
      errors: ["若只寫「不同」，追問：「哪個觀察讓你修改哪一部分？」"]
  - id: Q4
    label: "Q4"
    activity: act03
    prompt: "依兩個相干次波源的模型，完成B與D兩處的判斷。"
    parts:
      - {id: bp, type: choice, group: "B亮紋：", label: "相位", options: ["同相", "反相"]}
      - {id: bi, type: choice, group: "B亮紋：", label: "干涉", options: ["建設性", "破壞性"]}
      - {id: bs, type: choice, group: "B亮紋：", label: "光強", options: ["較強", "理想下為零"]}
      - {id: dp, type: choice, group: "D暗紋：", label: "相位", options: ["同相", "反相"]}
      - {id: di, type: choice, group: "D暗紋：", label: "干涉", options: ["建設性", "破壞性"]}
      - {id: ds, type: choice, group: "D暗紋：", label: "光強", options: ["較強", "理想下為零"]}
      - {id: x, type: text, label: "請用2–3句說明：兩列光波都能到達屏幕，為何仍有亮紋與暗紋？", lines: 3}
    teacher:
      key: {bp: "同相", bi: "建設性", bs: "較強", dp: "反相", di: "破壞性", ds: "理想下為零"}
      answer: ["B：同相、建設性干涉、光強較強。D：反相、破壞性干涉，等振幅理想情況下光強為零。", "判讀重點：學生是否以相位關係及疊加解釋明暗，而非只寫亮暗名稱。實際暗紋可能受背景光或振幅不等影響。"]
      errors: ["若認為D處沒有任何光波到達，追問：「從兩條狹縫出發的波能否都到達D？到達後如何疊加？」", "若說能量消失，追問：「其他屏幕位置的亮度有何變化？」"]
  - id: Q5
    label: "Q5"
    activity: act04
    prompt: "比較水波干涉與光的雙狹縫干涉，各寫一項可觀察的量，再寫一項共同規則。"
    parts:
      - {id: w, type: text, label: "水波可觀察：", lines: 1}
      - {id: l, type: text, label: "光的雙狹縫可觀察：", lines: 1}
      - {id: r, type: text, label: "共同規則：", lines: 1}
    teacher:
      answer: ["Q5：水波可看水面起伏；屏幕呈現時間平均的光強分布。共同規則為波的疊加與建設性／破壞性干涉。"]
      errors: ["若把水面瞬時位移直接當成光強，追問：「兩種活動各自直接看到的是什麼？」"]
  - id: Q6
    label: "Q6"
    activity: act04
    prompt: "請用4–5句解釋雙狹縫亮暗紋。依序說明：兩個次波源 → 光波疊加 → 亮紋 → 暗紋 → 與Q2觀察的連結。"
    parts:
      - {id: x, type: text, lines: 5}
    teacher:
      answer: ["Q6參考：兩窄縫可視為相干次波源。兩列光波在屏幕各處疊加。同相處增強形成亮紋。反相處減弱，等振幅時可完全相消形成暗紋。這可解釋Q2的明暗分布；若Q2僅模型，應註明尚待實際觀察支持。"]
      errors: ["若Q6只有名詞列表，追問：「請用『因為……所以……』連起相位、疊加與亮暗。」"]
